<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12091f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</main>

<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const token=localStorage.getItem('asta_token'),myTeam=localStorage.getItem('asta_team');if(!token||!myTeam)location.href='/';
const $=id=>document.getElementById(id);let state=null,ws=null,reconnectTimer=null,currentView='auction',timerInt=null,autoInt=null,lastNotifiedPid=null,lastRosterKey=null,lastAllRostersKey=null,selectedRosterTeam=null,modalLocked=false,pinLockShown=false,freeAgentData=null,freeRole='ALL',freeSort='quotazione',freeDesc=true,freeQuery='';
$('teamName').textContent=myTeam;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function clear(x){x.replaceChildren()}
function detail(d){if(!d)return'Operazione non riuscita.';if(typeof d.detail==='string')return d.detail;if(d.detail&&d.detail.message)return d.detail.message;return'Operazione non riuscita.'}
async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{}, {'Authorization':'Bearer '+token});const r=await fetch(path,opts);let d=null;const ct=r.headers.get('content-type')||'';if(ct.includes('application/json')){try{d=await r.json()}catch(e){}}if(r.status===401||(r.status===403&&d&&d.detail==='Squadra non piu\' valida.')){localStorage.removeItem('asta_token');localStorage.removeItem('asta_team');localStorage.removeItem('asta_manager');location.href='/'}return{r,d}}
function toast(text,error=false){const t=$('toast');t.textContent=text;t.className='toast'+(error?' error-toast':'');clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setConn(status,text){$('connDot').className='presence '+status;$('connText').textContent=text}
function roleLabel(r){return r==='P'?'POR':r==='Dd'?'DD':r==='Dc'?'DC':r==='Ds'?'DS':r==='Pc'?'PC':String(r||'').toUpperCase()}
function chipLabel(r){return r==='P'?'P':roleLabel(r)}
const ROLE_ORDER=['P','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc'];
function firstRole(g){return (g&&g.roles&&g.roles[0])||'X'}
function sortRoster(list){return [...list].sort((a,b)=>{const ai=ROLE_ORDER.indexOf(firstRole(a)),bi=ROLE_ORDER.indexOf(firstRole(b));return (ai<0?99:ai)-(bi<0?99:bi)||a.name.localeCompare(b.name,'it')})}
function roleBadges(roles){const stack=el('div','role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}
function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function avatarBlock(g){const wrap=el('div','avatar-wrap');let face;if(g.img){face=document.createElement('img');face.className='avatar';face.alt='';face.src=g.img;face.onerror=()=>{const fb=el('div','avatar-fallback',initials(g.name));face.replaceWith(fb);face=fb}}else face=el('div','avatar-fallback',initials(g.name));wrap.append(face,roleBadges(g.roles));return wrap}
function playerRow(g,{checkbox=false,onChange=null}={}){const row=el('div','player-row');const entry=el('div','player-entry grow');if(checkbox){const lab=el('label','checkbox-line grow');const cb=document.createElement('input');cb.type='checkbox';const inner=el('div','player-entry grow');inner.append(avatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));inner.append(txt);lab.append(cb,inner);entry.append(lab);if(onChange)cb.onchange=()=>onChange(cb.checked,g)}else{entry.classList.add('clickable-player');entry.append(avatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));entry.append(txt);entry.onclick=()=>showPlayerStats(g)}row.append(entry,el('span','price',String(g.price)));return row}
function participantStatus(t){if(t.market_finished)return'Mercato concluso';return({online:'Online',background:'In background',offline:'Offline'})[t.presence]||t.presence}
function activeTeams(){return(state?.teams||[]).filter(t=>!t.market_finished)}
function teamLine(t,response){const row=el('div','team-line');const left=el('div','team-main');left.append(el('span','presence '+(t.market_finished?'offline':t.presence)));const txt=el('div');txt.append(el('div','team-name',t.name+(t.is_manager?' 👑':'')),el('div','team-meta',participantStatus(t)));left.append(txt);const right=el('div');if(t.market_finished)right.appendChild(el('span','badge gray','🏁 Finito'));else if(response==='submitted')right.appendChild(el('span','badge green','✓ Risposto'));else if(response==='waiting')right.appendChild(el('span','badge gray','In attesa'));else right.appendChild(el('span',t.ready?'badge green':'badge gray',t.ready?'✓ Pronto':'Non pronto'));row.append(left,right);return row}
function updateHeader(){if(!state?.me)return;$('budgetVal').textContent=state.me.budget;$('rosterCount').textContent=`${state.me.roster_size}/${state.me.max_roster}`;$('teamLabel').textContent=state.me.is_manager?'Gestore Rannatoni':'Rannatone'}
function rosterKey(s){return s?.me?`${s.me.roster_signature||''}:${s.me.budget}`:null}
function setView(name){currentView=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));['auction','roster','rosters','free','history','lobby'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));if(name==='roster')loadRoster(false);if(name==='rosters')loadAllRosters(false);if(name==='free')loadFreeAgents(false);if(name==='history')loadHistory();if(name==='lobby')renderLobby();if(name==='auction')renderAuction()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function openModal(title,bodyNodes=[],actions=[],locked=false){modalLocked=locked;const m=$('modalCard');clear(m);m.appendChild(el('div','modal-title',title));const nodes=Array.isArray(bodyNodes)?bodyNodes:[bodyNodes];nodes.filter(Boolean).forEach(n=>m.appendChild(typeof n==='string'?el('p','small muted',n):n));if(actions.length){const a=el('div','modal-actions stack-mobile');actions.forEach(x=>{const b=el('button',x.className||'btn-ghost',x.text);b.onclick=x.onClick;a.appendChild(b)});m.appendChild(a)}$('modal').classList.remove('hidden')}
function closeModal(force=false){if(modalLocked&&!force)return;$('modal').classList.add('hidden');modalLocked=false}$('modal').onclick=e=>{if(e.target===$('modal')&&!modalLocked)closeModal()};
const STAT_LABEL_FALLBACK={quotazione:'Quotazione',fvm:'FVM',fantamedia:'FantaMedia',media_voto:'Media voto',presenze:'Presenze',gol:'Gol',assist:'Assist',ammonizioni:'Ammonizioni',espulsioni:'Espulsioni',rigori_segnati:'Rigori segnati',pma:'PMA',titolarita:'Titolarità',gol_subiti:'Gol subiti',rigori_parati:'Rigori parati'};
function statValue(v){return typeof v==='number'?String(v).replace('.',','):String(v??'—')}
async function showPlayerStats(g){if(!g?.pid)return;let player=g,labels={};try{const{r,d}=await api('/api/player/'+encodeURIComponent(g.pid));if(r.ok&&d?.player){player=d.player;labels=d.stat_labels||{}}}catch(e){}const body=el('div','player-detail-body');const head=el('div','player-detail-head');head.appendChild(avatarBlock(player));const txt=el('div','grow');txt.append(el('div','player-detail-name',player.name||'—'));if(player.full_name&&player.full_name!==player.name)txt.appendChild(el('div','tiny muted',player.full_name));txt.appendChild(el('div','meta',player.club||''));head.appendChild(txt);body.appendChild(head);const stats=player.stats||{};const keys=Object.keys(stats);if(keys.length){const grid=el('div','stats-grid');keys.forEach(k=>{const card=el('div','stat-card');card.append(el('span','',labels[k]||STAT_LABEL_FALLBACK[k]||k.replaceAll('_',' ')),el('strong','',statValue(stats[k])));grid.appendChild(card)});body.appendChild(grid)}else body.appendChild(el('div','notice','Statistiche non disponibili per questo calciatore.'));openModal('Scheda calciatore',body,[{text:'Chiudi',onClick:closeModal}])}

function heroRoleBadges(roles){const stack=el('div','hero-role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip hero-role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}function playerHero(p){const hero=el('div','player-hero clickable-player');const avatar=el('div','hero-avatar-wrap');let face;if(p?.img){face=document.createElement('img');face.src=p.img;face.alt='';face.onerror=()=>{const fb=el('div','hero-fallback',initials(p.name));face.replaceWith(fb);face=fb}}else face=el('div','hero-fallback',initials(p?.name));avatar.append(face,heroRoleBadges(p?.roles));hero.append(avatar,el('div','player-name',p?.name||'—'),el('div','player-club',p?.club||''));if(p?.pid)hero.onclick=()=>showPlayerStats(p);return hero}function progressLine(){const pr=state?.auction_progress||{};const total=Number(pr.total)||0,done=Number(pr.auctioned)||0;return el('div','auction-progress',total?`${done} / ${total} astati`:`${done} astati`)}

function renderLobby(){const box=$('view-lobby');clear(box);if(!state)return;const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;const c=el('section','card');const h=el('div','row between');const title=el('div');title.append(el('div','eyebrow','Lobby Rannatoni'),el('h2','',`${ready}/${total} pronti`));h.append(title,el('span',ready===total&&total?'badge green':'badge',ready===total&&total?'Tutti pronti':'In attesa'));c.appendChild(h);state.teams.forEach(t=>c.appendChild(teamLine(t)));box.appendChild(c);if(state.me){const own=el('section','card accent');if(state.me.market_finished){own.append(el('h2','','🏁 Hai concluso il mercato'),el('p','small muted','Puoi restare per seguire l’asta oppure disconnetterti dal menu.'))}else{own.appendChild(el('h2','',state.me.ready?'Sei pronto ✅':'Sei pronto?'));const b=el('button',state.me.ready?'btn-ok btn-block':'btn-primary btn-block',state.me.ready?'Non sono più pronto':'✅ Sono pronto');b.onclick=()=>toggleReady(!state.me.ready);own.appendChild(b)}box.prepend(own)}}
async function toggleReady(v){if(v)ensurePushSubscription(true).catch(()=>{});const{r,d}=await api('/api/ready',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ready:v})});if(!r.ok)return toast(detail(d),true)}

function renderAuction(){clearInterval(timerInt);clearInterval(autoInt);const box=$('view-auction');clear(box);if(!state)return;if(state.simulation)box.appendChild(el('div','notice warn','🧪 MODALITÀ SIMULAZIONE — al termine tornerà lo stato reale.'));if(state.mode==='idle')renderIdle(box);else if(state.mode==='bidding'||state.mode==='tiebreak')renderBidding(box);else if(state.mode==='release')renderRelease(box)}
function renderIdle(box){if(state.last_result&&(state.last_result.type==='assigned'||state.last_result.type==='no_offers'))box.appendChild(resultCard(state.last_result));if(state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined){const c=el('section','card compact accent');const line=el('div','row between');line.append(el('div','', '⚡ Prossima RANDOM automatica'),el('div','auto-count',String(state.auto_random_seconds)));c.appendChild(line);if(state.me.is_manager){const stop=el('button','btn-ghost btn-block','⏸ Ferma questa estrazione');stop.style.marginTop='8px';stop.onclick=skipNextAutoRandom;c.appendChild(stop)}box.appendChild(c);startAutoCountdown(state.auto_random_seconds)}const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;if(state.me.market_finished){const c=el('section','card compact');c.appendChild(el('div','notice','🏁 Hai concluso gli acquisti e non verrai più incluso nelle prossime aste.'));box.appendChild(c)}else if(!state.me.ready){const c=el('section','card');c.append(el('div','eyebrow','Prossima asta'),el('h2','',`${ready}/${total} Rannatoni pronti`));const b=el('button','btn-primary btn-block','✅ Sono pronto');b.onclick=()=>toggleReady(true);c.appendChild(b);box.appendChild(c)}if(state.me.is_manager)box.appendChild(managerIdleControls())}
function startAutoCountdown(v){let n=Number(v)||0;const tick=()=>{const target=document.querySelector('.auto-count');if(target)target.textContent=String(Math.max(0,n));n--};tick();autoInt=setInterval(tick,1000)}
function managerIdleControls(){const c=el('section','card accent');c.append(el('div','eyebrow','Gestione asta'),el('h2','','Prossimo giocatore'));const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;c.appendChild(el('div',ready?'notice ok':'notice warn',ready?`Pronti ${ready}/${total}. La busta coinvolgerà questi Rannatoni.`:'Nessun Rannatone pronto: non puoi avviare una busta.'));const toggle=el('div','toggle-row');const tx=el('div');tx.append(el('div','team-name','⚡ RANDOM automatico'),el('div','team-meta',state.auto_random?'Dopo ogni asta parte il prossimo giocatore.':'Avvio manuale tra un giocatore e l’altro.'));const sw=el('button','switch'+(state.auto_random?' on':''));sw.setAttribute('aria-label','RANDOM automatico');sw.onclick=()=>setAutoRandom(!state.auto_random);toggle.append(tx,sw);c.appendChild(toggle);const random=el('button','btn-primary btn-block','🎲 Estrai RANDOM');random.onclick=()=>openRandom();c.appendChild(random);c.appendChild(el('div','center tiny muted','oppure cerca un giocatore'));const inp=el('input','input');inp.placeholder='Cerca giocatore…';inp.style.marginTop='8px';const results=el('div','search-results');let debounce;inp.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>searchPlayers(inp.value,results),180)};c.append(inp,results);c.appendChild(el('div','hr'));const row=el('div','button-row stack-mobile');const undo=el('button','btn-ghost','↩️ Annulla ultima assegnazione');undo.onclick=undoLast;const more=el('button','btn-ghost','⋯ Altri comandi');more.onclick=openManagerTools;row.append(undo,more);c.appendChild(row);return c}
async function setAutoRandom(enabled){const{r,d}=await api('/api/auction/admin/auto-random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});if(!r.ok)toast(detail(d),true)}
async function skipNextAutoRandom(){const{r,d}=await api('/api/auction/admin/auto-random/skip',{method:'POST'});if(!r.ok)toast(detail(d),true);else toast('Prossima estrazione fermata')}
async function openRandom(){const{r,d}=await api('/api/auction/admin/random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});if(!r.ok)toast(detail(d),true)}
async function searchPlayers(q,box){clear(box);if(q.trim().length<2)return;const{r,d}=await api('/api/auction/admin/search?q='+encodeURIComponent(q));if(!r.ok)return;(d||[]).forEach(p=>{const b=el('button','search-item search-player-rich');const entry=el('div','player-entry grow');entry.appendChild(avatarBlock(p));const txt=el('div','grow');txt.append(el('div','name',p.name),el('div','meta',(p.club||'')+(p.passed?' · PASSATO':'')));entry.appendChild(txt);entry.classList.add('clickable-player');entry.onclick=e=>{e.stopPropagation();showPlayerStats(p)};b.append(entry,el('span','badge',p.passed?'Richiama':'Apri'));b.onclick=()=>openManualPlayer(p);box.appendChild(b)})}
async function openManualPlayer(p){const{r,d}=await api('/api/auction/admin/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:p.pid,force:true})});if(!r.ok)toast(detail(d),true)}

function renderBidding(box){const p=state.current_player;const c=el('section','card accent');c.appendChild(playerHero(p));c.appendChild(progressLine());c.appendChild(timerBlock());if(state.mode==='tiebreak')c.appendChild(el('div','notice warn',`⚔️ Spareggio a ${state.tiebreak_value}: solo i Rannatoni in parità possono rilanciare.`));box.appendChild(c);const eligible=state.eligible_teams.includes(myTeam);if(eligible)box.appendChild(bidCard());else box.appendChild(el('section','card compact',state.me.market_finished?'🏁 Hai concluso il mercato: puoi seguire l’asta senza partecipare.':state.mode==='tiebreak'?'Stai assistendo allo spareggio.':'Non eri Pronto quando è partita questa busta.'));const status=el('section','card');status.append(el('div','eyebrow','Buste'),el('h2','',`${state.submitted.length}/${state.eligible_teams.length} risposte`));state.teams.filter(t=>state.eligible_teams.includes(t.name)).forEach(t=>status.appendChild(teamLine(t,state.submitted.includes(t.name)?'submitted':'waiting')));box.appendChild(status);if(state.me.is_manager)box.appendChild(managerLiveControls())}
function timerBlock(){const d=el('div','timer');const strong=el('strong','',String(state.seconds_left??0));strong.id='timerVal';const label=el('div','tiny muted',state.paused?'IN PAUSA':'secondi');const line=el('div','timer-line');const fill=el('div','timer-fill');fill.id='timerFill';line.appendChild(fill);d.append(strong,label,line);startBidTimer(state.seconds_left??0,state.duration||60);return d}
function startBidTimer(v,total){let n=Math.max(0,Number(v)||0);const update=()=>{const x=$('timerVal'),f=$('timerFill');if(x){x.textContent=String(Math.ceil(n));x.classList.toggle('urgent',n<=10)}if(f){f.style.width=`${Math.max(0,Math.min(100,n/total*100))}%`;f.classList.toggle('urgent',n<=10)}if(!state?.paused)n=Math.max(0,n-1)};setTimeout(update,0);timerInt=setInterval(update,1000)}
function bidCard(){const c=el('section','card');const own=state.own_response;const minBid=Number(state.own_min_bid)||1;if(Number(state.own_release_floor)>0)c.appendChild(el('div','notice warn',`↩️ Lo hai svincolato a ${state.own_release_floor}: la tua offerta minima è ${state.own_release_floor}.`));if(own?.submitted){const text=own.action==='pass'?'Hai scelto PASSO':own.action==='hold'?`Hai mantenuto ${own.amount}`:`Hai offerto ${own.amount}`;c.appendChild(el('div','bid-status-clean','✅ '+text));const edit=el('button','btn-primary btn-block bid-action-primary',own.action==='bid'?'✏️ Modifica offerta':'✏️ Inserisci un’offerta');edit.onclick=()=>showBidComposer(own.action==='bid'?own.amount:'');c.appendChild(edit);if(own.action!=='pass'){const pass=el('button','btn-ghost btn-block bid-action-secondary',state.mode==='tiebreak'?'Mantieni offerta':'🖐️ Cambia in PASSO');pass.onclick=submitPass;c.appendChild(pass)}return c}c.append(el('h2','',state.mode==='tiebreak'?'Fai il tuo rilancio':'Fai la tua offerta'));const inp=el('input','input');inp.type='number';inp.inputMode='numeric';inp.min=minBid;inp.placeholder=`Minimo ${minBid}`;inp.id='bidInline';const row=el('div','button-row');const offer=el('button','btn-primary','💸 OFFRO');offer.onclick=()=>{const n=Number(inp.value);if(!Number.isInteger(n)||n<minBid)return toast(`Offerta minima ${minBid}.`,true);submitBid(n)};const pass=el('button','btn-ghost',state.mode==='tiebreak'?'Mantengo':'🖐️ PASSO');pass.onclick=submitPass;row.append(offer,pass);c.append(inp,row);return c}
function showBidComposer(value=''){const box=el('div');const minBid=Number(state.own_min_bid)||1;const p=el('p','small muted','Puoi cambiare la busta finché non viene aperta.');const inp=el('input','input');inp.type='number';inp.inputMode='numeric';inp.value=value;inp.min=minBid;inp.placeholder=`Minimo ${minBid}`;box.append(p,inp);openModal('Modifica offerta',box,[{text:'Annulla',onClick:closeModal},{text:'Salva offerta',className:'btn-primary',onClick:async()=>{const n=Number(inp.value);if(!Number.isInteger(n)||n<minBid)return toast(`Offerta minima ${minBid}.`,true);const ok=await submitBid(n);if(ok)closeModal()}}]);setTimeout(()=>inp.focus(),80)}
async function submitBid(amount){const{r,d}=await api('/api/auction/bid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});if(!r.ok){toast(detail(d),true);return false}toast('Offerta inviata ✓');return true}
async function submitPass(){const{r,d}=await api('/api/auction/pass',{method:'POST'});if(!r.ok){toast(detail(d),true);return false}toast(state.mode==='tiebreak'?'Offerta mantenuta ✓':'PASSO registrato ✓');return true}

function urlBase64ToUint8Array(value){const padding='='.repeat((4-value.length%4)%4);const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function ensurePushSubscription(silent=false){if(!window.isSecureContext||!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){if(!silent)toast('Installa Rannatoni come app per usare le notifiche.',true);return false}let permission=Notification.permission;if(permission==='default')permission=await Notification.requestPermission();if(permission!=='granted'){if(!silent)toast('Notifiche non autorizzate sul dispositivo.',true);return false}const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const{r,d}=await api('/api/push/public-key');if(!r.ok||!d?.public_key)throw new Error('Chiave push non disponibile');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(d.public_key)})}const{r,d}=await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});if(!r.ok)throw new Error(detail(d));localStorage.setItem('rannatoni_push_enabled','1');if(!silent)toast('Notifiche attive 🔔');return true}
async function disablePushSubscription(){if(!('serviceWorker'in navigator)||!('PushManager'in window))return;try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await api('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});await sub.unsubscribe()}}catch(e){}localStorage.removeItem('rannatoni_push_enabled')}
function allRostersKey(s){return(s?.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|')}function handleState(s){const oldKey=rosterKey(state),oldAll=allRostersKey(state);state=s;updateHeader();if(state?.me?.pin_must_change)showMandatoryPinChange();if(currentView==='auction')renderAuction();else if(currentView==='lobby')renderLobby();else if(currentView==='roster'&&rosterKey(s)!==lastRosterKey&&rosterKey(s)!==oldKey)loadRoster(true);else if(currentView==='rosters'&&allRostersKey(s)!==oldAll&&allRostersKey(s)!==lastAllRostersKey)loadAllRosters(true);else if(currentView==='free'&&allRostersKey(s)!==oldAll)loadFreeAgents(true)}
function sendPresence(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'presence',visibility:document.visibilityState}))}
function connect(){clearTimeout(reconnectTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onopen=()=>{setConn('online','Connesso');sendPresence()};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handleState(m.data);if(m.type==='result'){if(currentView==='history')loadHistory();if(currentView==='rosters')loadAllRosters(true);if(currentView==='free')loadFreeAgents(true)}}catch(err){}};ws.onclose=()=>{setConn('background','Riconnessione…');reconnectTimer=setTimeout(connect,1800)};ws.onerror=()=>setConn('offline','Problema di rete')}
document.addEventListener('visibilitychange',sendPresence);setInterval(sendPresence,8000);connect();
api('/api/state').then(({r,d})=>{if(r.ok)handleState(d)});if('serviceWorker'in navigator&&window.isSecureContext)navigator.serviceWorker.register('/sw.js').then(()=>{if(localStorage.getItem('rannatoni_push_enabled')==='1'&&'Notification'in window&&Notification.permission==='granted')ensurePushSubscription(true).catch(()=>{})}).catch(()=>{});
</script></body></html>
