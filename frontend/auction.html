<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12091f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rannatoni · Asta</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="/static/style.css">
</head><body><main class="app">
<div class="topbar"><div><div class="eyebrow" id="teamLabel">Rannatone</div><div class="brand" id="teamName">—</div><div class="tiny muted"><span id="connDot" class="presence offline"></span> <span id="connText">Connessione…</span></div></div><div class="topbar-right"><div class="stat"><strong id="budgetVal">–</strong><span>Residuo</span></div><div class="stat"><strong id="rosterCount">–</strong><span>Rosa</span></div><button id="profileBtn" class="btn-ghost btn-icon" aria-label="Menu">⋯</button></div></div>
<section id="view-auction"></section><section id="view-roster" class="hidden"></section><section id="view-rosters" class="hidden"></section><section id="view-history" class="hidden"></section><section id="view-lobby" class="hidden"></section>
</main>
<nav class="bottom-nav"><button class="nav-btn active" data-view="auction"><span class="ico">⚽</span>Asta</button><button class="nav-btn" data-view="roster"><span class="ico">👤</span>La mia rosa</button><button class="nav-btn" data-view="rosters"><span class="ico">👥</span>Rose</button><button class="nav-btn" data-view="history"><span class="ico">📜</span>Storico</button><button class="nav-btn" data-view="lobby"><span class="ico">🟢</span>Lobby</button></nav>
<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const token=localStorage.getItem('asta_token'),myTeam=localStorage.getItem('asta_team');if(!token||!myTeam)location.href='/';
const $=id=>document.getElementById(id);let state=null,ws=null,reconnectTimer=null,currentView='auction',timerInt=null,autoInt=null,lastNotifiedPid=null,lastRosterKey=null,lastAllRostersKey=null,selectedRosterTeam=null,modalLocked=false,pinLockShown=false;
$('teamName').textContent=myTeam;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function clear(x){x.replaceChildren()}
function detail(d){if(!d)return'Operazione non riuscita.';if(typeof d.detail==='string')return d.detail;if(d.detail&&d.detail.message)return d.detail.message;return'Operazione non riuscita.'}
async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{}, {'Authorization':'Bearer '+token});const r=await fetch(path,opts);let d=null;const ct=r.headers.get('content-type')||'';if(ct.includes('application/json')){try{d=await r.json()}catch(e){}}if(r.status===401||(r.status===403&&d&&d.detail==='Squadra non piu\' valida.')){localStorage.removeItem('asta_token');localStorage.removeItem('asta_team');localStorage.removeItem('asta_manager');location.href='/'}return{r,d}}
function toast(text,error=false){const t=$('toast');t.textContent=text;t.className='toast'+(error?' error-toast':'');clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setConn(status,text){$('connDot').className='presence '+status;$('connText').textContent=text}
function roleLabel(r){return r==='P'?'POR':r==='Dd'?'DD':r==='Dc'?'DC':r==='Ds'?'DS':r==='Pc'?'PC':String(r||'').toUpperCase()}
function chipLabel(r){return r==='P'?'P':roleLabel(r)}
const ROLE_ORDER=['P','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc'];
function firstRole(g){return (g&&g.roles&&g.roles[0])||'X'}
function sortRoster(list){return [...list].sort((a,b)=>{const ai=ROLE_ORDER.indexOf(firstRole(a)),bi=ROLE_ORDER.indexOf(firstRole(b));return (ai<0?99:ai)-(bi<0?99:bi)||a.name.localeCompare(b.name,'it')})}
function roleBadges(roles){const stack=el('div','role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}
function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function avatarBlock(g){const wrap=el('div','avatar-wrap');let face;if(g.img){face=document.createElement('img');face.className='avatar';face.alt='';face.src=g.img;face.onerror=()=>{const fb=el('div','avatar-fallback',initials(g.name));face.replaceWith(fb);face=fb}}else face=el('div','avatar-fallback',initials(g.name));wrap.append(face,roleBadges(g.roles));return wrap}
function playerRow(g,{checkbox=false,onChange=null}={}){const row=el('div','player-row');const entry=el('div','player-entry grow');if(checkbox){const lab=el('label','checkbox-line grow');const cb=document.createElement('input');cb.type='checkbox';const inner=el('div','player-entry grow');inner.append(avatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));inner.append(txt);lab.append(cb,inner);entry.append(lab);if(onChange)cb.onchange=()=>onChange(cb.checked,g)}else{entry.append(avatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));entry.append(txt)}row.append(entry,el('span','price',`${g.price} cr`));return row}
function participantStatus(t){if(t.market_finished)return'Mercato concluso';return({online:'Online',background:'In background',offline:'Offline'})[t.presence]||t.presence}
function activeTeams(){return(state?.teams||[]).filter(t=>!t.market_finished)}
function teamLine(t,response){const row=el('div','team-line');const left=el('div','team-main');left.append(el('span','presence '+(t.market_finished?'offline':t.presence)));const txt=el('div');txt.append(el('div','team-name',t.name+(t.is_manager?' 👑':'')),el('div','team-meta',participantStatus(t)));left.append(txt);const right=el('div');if(t.market_finished)right.appendChild(el('span','badge gray','🏁 Finito'));else if(response==='submitted')right.appendChild(el('span','badge green','✓ Risposto'));else if(response==='waiting')right.appendChild(el('span','badge gray','In attesa'));else right.appendChild(el('span',t.ready?'badge green':'badge gray',t.ready?'✓ Pronto':'Non pronto'));row.append(left,right);return row}
function updateHeader(){if(!state?.me)return;$('budgetVal').textContent=state.me.budget;$('rosterCount').textContent=`${state.me.roster_size}/${state.me.max_roster}`;$('teamLabel').textContent=state.me.is_manager?'Gestore Rannatoni':'Rannatone'}
function rosterKey(s){return s?.me?`${s.me.roster_signature||''}:${s.me.budget}`:null}
function setView(name){currentView=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));['auction','roster','rosters','history','lobby'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));if(name==='roster')loadRoster(false);if(name==='rosters')loadAllRosters(false);if(name==='history')loadHistory();if(name==='lobby')renderLobby();if(name==='auction')renderAuction()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function openModal(title,bodyNodes=[],actions=[],locked=false){modalLocked=locked;const m=$('modalCard');clear(m);m.appendChild(el('div','modal-title',title));const nodes=Array.isArray(bodyNodes)?bodyNodes:[bodyNodes];nodes.filter(Boolean).forEach(n=>m.appendChild(typeof n==='string'?el('p','small muted',n):n));if(actions.length){const a=el('div','modal-actions stack-mobile');actions.forEach(x=>{const b=el('button',x.className||'btn-ghost',x.text);b.onclick=x.onClick;a.appendChild(b)});m.appendChild(a)}$('modal').classList.remove('hidden')}
function closeModal(force=false){if(modalLocked&&!force)return;$('modal').classList.add('hidden');modalLocked=false}$('modal').onclick=e=>{if(e.target===$('modal')&&!modalLocked)closeModal()};
function playerHero(p){const hero=el('div','player-hero');if(p?.img){const im=document.createElement('img');im.src=p.img;im.alt='';im.onerror=()=>im.replaceWith(el('div','hero-fallback',initials(p.name)));hero.appendChild(im)}else hero.appendChild(el('div','hero-fallback',initials(p?.name)));hero.append(el('div','player-name',p?.name||'—'),el('div','player-role',(p?.roles||[]).map(roleLabel).join(' · ')),el('div','player-club',p?.club||''));return hero}

function renderLobby(){const box=$('view-lobby');clear(box);if(!state)return;const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;const c=el('section','card');const h=el('div','row between');const title=el('div');title.append(el('div','eyebrow','Lobby Rannatoni'),el('h2','',`${ready}/${total} pronti`));h.append(title,el('span',ready===total&&total?'badge green':'badge',ready===total&&total?'Tutti pronti':'In attesa'));c.appendChild(h);state.teams.forEach(t=>c.appendChild(teamLine(t)));box.appendChild(c);if(state.me){const own=el('section','card accent');if(state.me.market_finished){own.append(el('h2','','🏁 Hai concluso il mercato'),el('p','small muted','Puoi restare per seguire l’asta oppure disconnetterti dal menu.'))}else{own.appendChild(el('h2','',state.me.ready?'Sei pronto ✅':'Sei pronto?'));const b=el('button',state.me.ready?'btn-ok btn-block':'btn-primary btn-block',state.me.ready?'Non sono più pronto':'✅ Sono pronto');b.onclick=()=>toggleReady(!state.me.ready);own.appendChild(b)}box.prepend(own)}}
async function toggleReady(v){const{r,d}=await api('/api/ready',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ready:v})});if(!r.ok)return toast(detail(d),true);if(v&&window.isSecureContext&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}

function renderAuction(){clearInterval(timerInt);clearInterval(autoInt);const box=$('view-auction');clear(box);if(!state)return;if(state.simulation)box.appendChild(el('div','notice warn','🧪 MODALITÀ SIMULAZIONE — al termine tornerà lo stato reale.'));if(state.mode==='idle')renderIdle(box);else if(state.mode==='bidding'||state.mode==='tiebreak')renderBidding(box);else if(state.mode==='release')renderRelease(box)}
function renderIdle(box){if(state.last_result&&(state.last_result.type==='assigned'||state.last_result.type==='no_offers'))box.appendChild(resultCard(state.last_result));if(state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined){const c=el('section','card compact accent');const line=el('div','row between');line.append(el('div','', '⚡ Prossima RANDOM automatica'),el('div','auto-count',String(state.auto_random_seconds)));c.appendChild(line);if(state.me.is_manager){const stop=el('button','btn-ghost btn-block','⏸ Ferma questa estrazione');stop.style.marginTop='8px';stop.onclick=skipNextAutoRandom;c.appendChild(stop)}box.appendChild(c);startAutoCountdown(state.auto_random_seconds)}const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;const c=el('section','card');c.append(el('div','eyebrow','Prossima asta'),el('h2','',`${ready}/${total} Rannatoni pronti`));if(state.me.market_finished)c.appendChild(el('div','notice','🏁 Hai concluso gli acquisti e non verrai più incluso nelle prossime aste.'));else{const b=el('button',state.me.ready?'btn-ok btn-block':'btn-primary btn-block',state.me.ready?'✓ Sei pronto':'✅ Sono pronto');b.onclick=()=>toggleReady(!state.me.ready);c.appendChild(b)}box.appendChild(c);if(state.me.is_manager)box.appendChild(managerIdleControls())}
function startAutoCountdown(v){let n=Number(v)||0;const tick=()=>{const target=document.querySelector('.auto-count');if(target)target.textContent=String(Math.max(0,n));n--};tick();autoInt=setInterval(tick,1000)}
function managerIdleControls(){const c=el('section','card accent');c.append(el('div','eyebrow','Gestione asta'),el('h2','','Prossimo giocatore'));const active=activeTeams(),ready=active.filter(t=>t.ready).length,total=active.length;c.appendChild(el('div',ready?'notice ok':'notice warn',ready?`Pronti ${ready}/${total}. La busta coinvolgerà questi Rannatoni.`:'Nessun Rannatone pronto: non puoi avviare una busta.'));const toggle=el('div','toggle-row');const tx=el('div');tx.append(el('div','team-name','⚡ RANDOM automatico'),el('div','team-meta',state.auto_random?'Dopo ogni asta parte il prossimo giocatore.':'Avvio manuale tra un giocatore e l’altro.'));const sw=el('button','switch'+(state.auto_random?' on':''));sw.setAttribute('aria-label','RANDOM automatico');sw.onclick=()=>setAutoRandom(!state.auto_random);toggle.append(tx,sw);c.appendChild(toggle);const random=el('button','btn-primary btn-block','🎲 Estrai RANDOM');random.onclick=()=>openRandom();c.appendChild(random);c.appendChild(el('div','center tiny muted','oppure cerca un giocatore'));const inp=el('input','input');inp.placeholder='Cerca giocatore…';inp.style.marginTop='8px';const results=el('div','search-results');let debounce;inp.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>searchPlayers(inp.value,results),180)};c.append(inp,results);c.appendChild(el('div','hr'));const row=el('div','button-row stack-mobile');const undo=el('button','btn-ghost','↩️ Annulla ultima assegnazione');undo.onclick=undoLast;const more=el('button','btn-ghost','⋯ Altri comandi');more.onclick=openManagerTools;row.append(undo,more);c.appendChild(row);return c}
async function setAutoRandom(enabled){const{r,d}=await api('/api/auction/admin/auto-random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});if(!r.ok)toast(detail(d),true)}
async function skipNextAutoRandom(){const{r,d}=await api('/api/auction/admin/auto-random/skip',{method:'POST'});if(!r.ok)toast(detail(d),true);else toast('Prossima estrazione fermata')}
async function openRandom(){const{r,d}=await api('/api/auction/admin/random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});if(!r.ok)toast(detail(d),true)}
async function searchPlayers(q,box){clear(box);if(q.trim().length<2)return;const{r,d}=await api('/api/auction/admin/search?q='+encodeURIComponent(q));if(!r.ok)return;(d||[]).forEach(p=>{const b=el('button','search-item');const left=el('div');left.append(el('div','team-name',p.name),el('div','meta',(p.roles||[]).map(roleLabel).join('/')+(p.club?' · '+p.club:'')+(p.passed?' · PASSATO':'')));b.append(left,el('span','badge',p.passed?'Richiama':'Apri'));b.onclick=()=>openManualPlayer(p);box.appendChild(b)})}
async function openManualPlayer(p){const{r,d}=await api('/api/auction/admin/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:p.pid,force:true})});if(!r.ok)toast(detail(d),true)}

function renderBidding(box){const p=state.current_player;const c=el('section','card accent');c.appendChild(playerHero(p));c.appendChild(timerBlock());if(state.mode==='tiebreak')c.appendChild(el('div','notice warn',`⚔️ Spareggio a ${state.tiebreak_value} crediti: solo i Rannatoni in parità possono rilanciare.`));box.appendChild(c);const eligible=state.eligible_teams.includes(myTeam);if(eligible)box.appendChild(bidCard());else box.appendChild(el('section','card compact',state.me.market_finished?'🏁 Hai concluso il mercato: puoi seguire l’asta senza partecipare.':state.mode==='tiebreak'?'Stai assistendo allo spareggio.':'Non eri Pronto quando è partita questa busta.'));const status=el('section','card');status.append(el('div','eyebrow','Buste'),el('h2','',`${state.submitted.length}/${state.eligible_teams.length} risposte`));state.teams.filter(t=>state.eligible_teams.includes(t.name)).forEach(t=>status.appendChild(teamLine(t,state.submitted.includes(t.name)?'submitted':'waiting')));box.appendChild(status);if(state.me.is_manager)box.appendChild(managerLiveControls())}
function timerBlock(){const d=el('div','timer');const strong=el('strong','',String(state.seconds_left??0));strong.id='timerVal';const label=el('div','tiny muted',state.paused?'IN PAUSA':'secondi');const line=el('div','timer-line');const fill=el('div','timer-fill');fill.id='timerFill';line.appendChild(fill);d.append(strong,label,line);startBidTimer(state.seconds_left??0,state.duration||60);return d}
function startBidTimer(v,total){let n=Math.max(0,Number(v)||0);const update=()=>{const x=$('timerVal'),f=$('timerFill');if(x){x.textContent=String(Math.ceil(n));x.classList.toggle('urgent',n<=10)}if(f){f.style.width=`${Math.max(0,Math.min(100,n/total*100))}%`;f.classList.toggle('urgent',n<=10)}if(!state?.paused)n=Math.max(0,n-1)};setTimeout(update,0);timerInt=setInterval(update,1000)}
function bidCard(){const c=el('section','card');const own=state.own_response;if(own?.submitted){const text=own.action==='pass'?'Hai scelto PASSO':own.action==='hold'?`Hai mantenuto ${own.amount} cr`:`Hai offerto ${own.amount} cr`;c.appendChild(el('div','bid-status-clean','✅ '+text));const edit=el('button','btn-primary btn-block bid-action-primary',own.action==='bid'?'✏️ Modifica offerta':'✏️ Inserisci un’offerta');edit.onclick=()=>showBidComposer(own.action==='bid'?own.amount:'');c.appendChild(edit);if(own.action!=='pass'){const pass=el('button','btn-ghost btn-block bid-action-secondary',state.mode==='tiebreak'?'Mantieni offerta':'🖐️ Cambia in PASSO');pass.onclick=submitPass;c.appendChild(pass)}return c}c.append(el('h2','',state.mode==='tiebreak'?'Fai il tuo rilancio':'Fai la tua offerta'));const inp=el('input','input');inp.type='number';inp.inputMode='numeric';inp.min=state.mode==='tiebreak'?Number(state.tiebreak_value)+1:1;inp.placeholder=state.mode==='tiebreak'?`Minimo ${Number(state.tiebreak_value)+1}`:'Crediti';inp.id='bidInline';const row=el('div','button-row');const offer=el('button','btn-primary','💸 OFFRO');offer.onclick=()=>{const n=Number(inp.value);if(!Number.isInteger(n)||n<=0)return toast('Inserisci un’offerta valida.',true);submitBid(n)};const pass=el('button','btn-ghost',state.mode==='tiebreak'?'Mantengo':'🖐️ PASSO');pass.onclick=submitPass;row.append(offer,pass);c.append(inp,row);return c}
function showBidComposer(value=''){const box=el('div');const p=el('p','small muted','Puoi cambiare la busta finché il gestore non la apre.');const inp=el('input','input');inp.type='number';inp.inputMode='numeric';inp.value=value;inp.min=state.mode==='tiebreak'?Number(state.tiebreak_value)+1:1;inp.placeholder=state.mode==='tiebreak'?`Minimo ${Number(state.tiebreak_value)+1}`:'Crediti';box.append(p,inp);openModal('Modifica offerta',box,[{text:'Annulla',onClick:closeModal},{text:'Salva offerta',className:'btn-primary',onClick:async()=>{const n=Number(inp.value);if(!Number.isInteger(n)||n<=0)return toast('Inserisci un’offerta valida.',true);const ok=await submitBid(n);if(ok)closeModal()}}]);setTimeout(()=>inp.focus(),80)}
async function submitBid(amount){const{r,d}=await api('/api/auction/bid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});if(!r.ok){toast(detail(d),true);return false}toast('Offerta inviata ✓');return true}
async function submitPass(){const{r,d}=await api('/api/auction/pass',{method:'POST'});if(!r.ok){toast(detail(d),true);return false}toast(state.mode==='tiebreak'?'Offerta mantenuta ✓':'PASSO registrato ✓');return true}
function managerLiveControls(){const c=el('section','card accent');c.append(el('div','eyebrow','Gestore'),el('h2','','Controlli asta'));const close=el('button','btn-primary btn-block','🔓 Apri buste ora');close.onclick=async()=>{const{r,d}=await api('/api/auction/admin/close',{method:'POST'});if(!r.ok)toast(detail(d),true)};c.appendChild(close);const row=el('div','button-row');const pause=el('button','btn-ghost',state.paused?'▶️ Riprendi':'⏸️ Pausa');pause.onclick=()=>managerAction(state.paused?'/api/auction/admin/resume':'/api/auction/admin/pause');const plus=el('button','btn-ghost','+30 s');plus.onclick=()=>managerAction('/api/auction/admin/add-time',{seconds:30});row.append(pause,plus);c.appendChild(row);const cancel=el('button','btn-danger btn-block','Annulla asta corrente');cancel.style.marginTop='8px';cancel.onclick=()=>managerAction('/api/auction/admin/cancel');c.appendChild(cancel);return c}
async function managerAction(path,payload=null){const opts={method:'POST'};if(payload!==null){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(payload)}const{r,d}=await api(path,opts);if(!r.ok)toast(detail(d),true);return r.ok}

function resultCard(r){const c=el('section','card result');if(r.type==='no_offers'){c.append(el('div','eyebrow','Esito'),el('h2','',`${r.player_name} è passato`),el('p','small muted','Nessuna offerta. Il giocatore resta richiamabile manualmente.'))}else{c.append(el('div','eyebrow','Ultimo risultato'),el('h2','',`🏆 ${r.player_name} → ${r.team}`),el('div','center price',`${r.price} crediti`));if(r.tocca)c.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · spareggio chiuso in parità'));appendReleased(c,r.released)}if(r.reveal)appendOffers(c,r.reveal,true);return c}
function appendReleased(container,released){if(!released?.length)return;const wrap=el('div','release-summary');wrap.appendChild(el('div','eyebrow history-section-title','Svincolati'));released.forEach(g=>{const row=el('div','release-line');row.append(el('span','',g.name||`ID ${g.pid}`),el('span','price',`${g.price} cr`));wrap.appendChild(row)});container.appendChild(wrap)}
function appendOffers(container,reveal,collapsible=false){if(!reveal)return;const content=collapsible?document.createElement('details'):el('div','history-offers');if(collapsible){content.className='history-offers';const sum=document.createElement('summary');sum.textContent='Offerte';content.appendChild(sum)}else content.appendChild(el('div','eyebrow history-section-title','Offerte'));Object.entries(reveal).sort((a,b)=>b[1]-a[1]).forEach(([team,v])=>{const row=el('div','offer-row');row.append(el('span','',team),el('span','price',v===0?'PASSO':String(v)));content.appendChild(row)});container.appendChild(content)}
async function renderRelease(box){const pub=state.release_public;if(!pub)return;if(pub.team!==myTeam){const c=el('section','card');c.append(el('h2','',`💰 ${pub.team} sta effettuando gli svincoli`),el('p','muted small','La prossima asta partirà solo dopo il completamento dell’acquisto.'));box.appendChild(c);return}const info=state.release_info;const c=el('section','card danger');c.append(el('div','eyebrow','Svincoli necessari'),el('h2','',`Hai vinto a ${info.price} crediti`),el('p','small muted',`Residuo: ${info.budget} cr. Seleziona chi vuoi svincolare.`));box.appendChild(c);const roster=await fetchRoster();if(!roster)return;const selected=new Set();const list=el('section','card player-list');const status=el('div','notice warn');list.appendChild(status);sortRoster(roster).forEach(g=>list.appendChild(playerRow(g,{checkbox:true,onChange:(checked,x)=>{checked?selected.add(x.pid):selected.delete(x.pid);update()}})));const confirmBtn=el('button','btn-primary btn-block','Completa acquisto');confirmBtn.style.marginTop='12px';confirmBtn.onclick=()=>submitReleases([...selected]);list.appendChild(confirmBtn);box.appendChild(list);function update(){const chosen=roster.filter(g=>selected.has(g.pid));const refund=chosen.reduce((s,g)=>s+g.price,0),available=info.budget+refund,slots=roster.length-chosen.length+1;const ok=available>=info.price&&slots<=info.max_roster;status.className=ok?'notice ok':'notice warn';status.textContent=`Crediti disponibili: ${available} · Rosa finale: ${slots}/${info.max_roster}`;confirmBtn.disabled=!ok}update()}
async function submitReleases(pids){const{r,d}=await api('/api/auction/release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pids})});if(!r.ok)toast(detail(d),true)}
async function fetchRoster(){const{r,d}=await api('/api/roster/me');return r.ok?d:null}

async function loadRoster(preserve=true){const box=$('view-roster');const y=preserve?window.scrollY:0;if(!preserve){clear(box);box.appendChild(el('div','notice','Caricamento rosa…'))}const roster=await fetchRoster();if(!roster)return;clear(box);const head=el('section','card compact');head.append(el('div','eyebrow','La mia rosa'),el('h2','',`${roster.length}/${state?.me?.max_roster||35} giocatori`));box.appendChild(head);const list=el('section','card player-list');sortRoster(roster).forEach(g=>list.appendChild(playerRow(g)));if(!roster.length)list.appendChild(el('p','muted small','Rosa vuota.'));box.appendChild(list);lastRosterKey=rosterKey(state);if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}
async function loadAllRosters(preserve=true){const box=$('view-rosters'),y=preserve?window.scrollY:0;if(!preserve){clear(box);box.appendChild(el('div','notice','Caricamento rose…'))}const{r,d}=await api('/api/rosters');if(!r.ok)return toast(detail(d),true);clear(box);lastAllRostersKey=(d.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|');if(selectedRosterTeam){const team=(d.teams||[]).find(t=>t.name===selectedRosterTeam);if(!team){selectedRosterTeam=null;return loadAllRosters(false)}const back=el('button','btn-ghost btn-sm','← Tutte le rose');back.onclick=()=>{selectedRosterTeam=null;loadAllRosters(false)};const head=el('section','card compact');head.append(back,el('div','eyebrow','Rosa Rannatoni'),el('h2','',team.name),el('div','roster-summary',`${team.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-team.roster_size)} posti liberi · ${team.budget} cr`));box.appendChild(head);const list=el('section','card player-list');sortRoster((d.rosters||{})[team.name]||[]).forEach(g=>list.appendChild(playerRow(g)));box.appendChild(list)}else{const head=el('section','card compact');head.append(el('div','eyebrow','Rannatoni'),el('h2','','Tutte le rose'),el('p','small muted','Tocca una squadra per vedere i giocatori.'));box.appendChild(head);const list=el('section','card');(d.teams||[]).forEach(t=>{const row=el('button','roster-team-row');const left=el('div','grow');left.append(el('div','team-name',t.name+(t.market_finished?' 🏁':'')),el('div','team-meta',`${t.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-t.roster_size)} posti liberi`));row.append(left,el('span','roster-budget',`${t.budget} cr`));row.onclick=()=>{selectedRosterTeam=t.name;loadAllRosters(false)};list.appendChild(row)});box.appendChild(list)}if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}

function pinFields(includeCurrent){const wrap=el('div');let current=null;if(includeCurrent){const f=el('div','field');f.appendChild(el('label','','PIN attuale'));current=document.createElement('input');current.className='input';current.type='password';current.inputMode='numeric';current.autocomplete='current-password';f.appendChild(current);wrap.appendChild(f)}const f1=el('div','field');f1.appendChild(el('label','','Nuovo PIN'));const next=document.createElement('input');next.className='input';next.type='password';next.inputMode='numeric';next.autocomplete='new-password';next.placeholder='4 o 6 cifre';f1.appendChild(next);const f2=el('div','field');f2.appendChild(el('label','','Ripeti nuovo PIN'));const repeat=document.createElement('input');repeat.className='input';repeat.type='password';repeat.inputMode='numeric';repeat.autocomplete='new-password';f2.appendChild(repeat);const err=el('div','error');wrap.append(f1,f2,err);return{wrap,current,next,repeat,err}}
function validNewPin(fields){const p=fields.next.value.trim();if(!(/^\d{4}$/.test(p)||/^\d{6}$/.test(p))){fields.err.textContent='Il PIN deve avere esattamente 4 oppure 6 cifre.';return null}if(p!==fields.repeat.value.trim()){fields.err.textContent='I due nuovi PIN non coincidono.';return null}fields.err.textContent='';return p}
function showMandatoryPinChange(){if(pinLockShown||!state?.me?.pin_must_change)return;pinLockShown=true;const f=pinFields(false);openModal('🔐 Scegli il tuo PIN',[el('p','small muted','Questo è il primo accesso con un PIN temporaneo. Imposta ora il tuo PIN personale: il Super Admin non potrà vederlo.'),f.wrap],[{text:'Salva nuovo PIN',className:'btn-primary',onClick:async()=>{const p=validNewPin(f);if(!p)return;const{r,d}=await api('/api/account/pin/first',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_pin:p})});if(!r.ok){f.err.textContent=detail(d);return}pinLockShown=false;modalLocked=false;closeModal(true);toast('PIN personale impostato ✓')}}],true)}
function showProfilePinChange(){modalLocked=false;const f=pinFields(true);openModal('Cambia PIN',f.wrap,[{text:'Chiudi',onClick:closeModal},{text:'Salva',className:'btn-primary',onClick:async()=>{const p=validNewPin(f);if(!p)return;const{r,d}=await api('/api/account/pin/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_pin:f.current.value.trim(),new_pin:p})});if(!r.ok){f.err.textContent=detail(d);return}closeModal();toast('PIN aggiornato ✓')}}])}
async function loadHistory(){const box=$('view-history');clear(box);box.appendChild(el('div','notice','Caricamento storico…'));const{r,d}=await api('/api/history');clear(box);if(!r.ok)return;const h=el('section','card compact');h.append(el('div','eyebrow','Rannatoni'),el('h2','','Storico asta'));box.appendChild(h);if(!d.length){h.appendChild(el('p','muted small','Nessuna asta conclusa.'));return}(d||[]).forEach(ev=>{const det=document.createElement('details');const sum=document.createElement('summary');sum.textContent=ev.event_type==='no_offers'?`${ev.player_name} — PASSATO`:`${ev.player_name} — ${ev.team} — ${ev.price} cr`;det.appendChild(sum);det.appendChild(el('div','tiny muted',String(ev.ts||'').replace('T',' ')));if(ev.tocca)det.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · assegnato tramite sorteggio.'));appendReleased(det,ev.released);if(ev.reveal)appendOffers(det,ev.reveal);box.appendChild(det)})}
async function undoLast(){const{r,d}=await api('/api/auction/admin/undo-last',{method:'POST'});if(!r.ok)toast(detail(d),true);else toast('Ultima assegnazione annullata')}

function openManagerTools(){const body=el('div');const reset=el('button','btn-ghost btn-block','Azzera stato “Pronto”');reset.onclick=async()=>{if(await managerAction('/api/auction/admin/reset-ready'))closeModal()};body.appendChild(reset);const passed=el('button','btn-ghost btn-block','Giocatori passati');passed.style.marginTop='8px';passed.onclick=loadPassedInModal;body.appendChild(passed);const finished=el('button','btn-ghost btn-block','Riattiva un Rannatone');finished.style.marginTop='8px';finished.onclick=loadFinishedInModal;body.appendChild(finished);const sim=el('button',state.simulation?'btn-danger btn-block':'btn-ghost btn-block',state.simulation?'🧪 Termina simulazione':'🧪 Avvia simulazione');sim.style.marginTop='8px';sim.onclick=toggleSimulation;body.appendChild(sim);openModal('Altri comandi',body,[{text:'Chiudi',onClick:closeModal}])}
async function loadPassedInModal(){const{r,d}=await api('/api/auction/admin/passed');if(!r.ok)return toast(detail(d),true);const body=el('div');if(!d.length)body.appendChild(el('p','muted small','Nessun giocatore passato.'));d.forEach(p=>{const row=el('div','team-line');const left=el('div');left.append(el('div','team-name',p.name),el('div','team-meta',(p.roles||[]).map(roleLabel).join('/')+(p.club?' · '+p.club:'')));const b=el('button','btn-ghost btn-sm','Rimetti in RANDOM');b.onclick=async()=>{if(await managerAction('/api/auction/admin/reopen-passed',{pid:p.pid}))loadPassedInModal()};row.append(left,b);body.appendChild(row)});openModal('Giocatori passati',body,[{text:'Chiudi',onClick:closeModal}])}
function loadFinishedInModal(){const finished=(state.teams||[]).filter(t=>t.market_finished);const body=el('div');if(!finished.length)body.appendChild(el('p','muted small','Nessun Rannatone ha concluso il mercato.'));finished.forEach(t=>{const row=el('div','team-line');row.append(el('div','team-name',t.name));const b=el('button','btn-ghost btn-sm','Riattiva');b.onclick=async()=>{if(await managerAction('/api/auction/admin/reactivate-team',{team:t.name})){toast(`${t.name} riattivato`);closeModal()}};row.appendChild(b);body.appendChild(row)});openModal('Riattiva Rannatone',body,[{text:'Chiudi',onClick:closeModal}])}
async function toggleSimulation(){const path=state.simulation?'/api/auction/admin/simulation/end':'/api/auction/admin/simulation/start';const{r,d}=await api(path,{method:'POST'});if(!r.ok)toast(detail(d),true);else{closeModal();toast(state.simulation?'Stato reale ripristinato':'Simulazione avviata')}}

$('profileBtn').onclick=openProfile;
function openProfile(){const body=el('div');body.append(el('div','notice',state?.me?.market_finished?'🏁 Hai concluso il mercato.':`Account: ${myTeam}`));if(state?.me?.is_manager&&Number.isInteger(state?.spectator_count))body.appendChild(el('div','notice',`👀 Spettatori collegati: ${state.spectator_count}`));const pin=el('button','btn-ghost btn-block','🔐 Cambia PIN');pin.style.marginTop='10px';pin.onclick=showProfilePinChange;body.appendChild(pin);if(!state?.me?.market_finished){const finish=el('button','btn-ghost btn-block','🏁 Ho finito gli acquisti');finish.style.marginTop='8px';finish.disabled=state?.mode!=='idle';finish.onclick=finishMarket;body.appendChild(finish)}if(state?.me?.is_manager){const setup=el('button','btn-ghost btn-block','⚙️ Pannello Super Admin');setup.style.marginTop='8px';setup.onclick=()=>location.href='/admin';body.appendChild(setup)}const logout=el('button','btn-danger btn-block','Disconnetti');logout.style.marginTop='8px';logout.onclick=logoutTeam;body.appendChild(logout);openModal('Rannatone',body,[{text:'Chiudi',onClick:closeModal}])}
async function finishMarket(){const{r,d}=await api('/api/market/finish',{method:'POST'});if(!r.ok)toast(detail(d),true);else{closeModal();toast('Mercato concluso 🏁')}}
async function logoutTeam(){try{await api('/api/logout',{method:'POST'})}catch(e){}localStorage.removeItem('asta_token');localStorage.removeItem('asta_team');localStorage.removeItem('asta_manager');location.href='/'}

function maybeNotify(s){const pid=s.current_player&&s.current_player.pid;if(!pid||pid===lastNotifiedPid)return;lastNotifiedPid=pid;if(document.hidden&&'Notification'in window&&Notification.permission==='granted'&&'serviceWorker'in navigator){navigator.serviceWorker.ready.then(reg=>reg.showNotification('Nuova asta Rannatoni',{body:s.current_player.name+' — entra per offrire',icon:'/static/icon-192.png',tag:'asta-'+pid})).catch(()=>{})}}
function allRostersKey(s){return(s?.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|')}function handleState(s){const oldKey=rosterKey(state),oldAll=allRostersKey(state);state=s;updateHeader();maybeNotify(s);if(state?.me?.pin_must_change)showMandatoryPinChange();if(currentView==='auction')renderAuction();else if(currentView==='lobby')renderLobby();else if(currentView==='roster'&&rosterKey(s)!==lastRosterKey&&rosterKey(s)!==oldKey)loadRoster(true);else if(currentView==='rosters'&&allRostersKey(s)!==oldAll&&allRostersKey(s)!==lastAllRostersKey)loadAllRosters(true)}
function sendPresence(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'presence',visibility:document.visibilityState}))}
function connect(){clearTimeout(reconnectTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onopen=()=>{setConn('online','Connesso');sendPresence()};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handleState(m.data);if(m.type==='result'){if(currentView==='history')loadHistory();if(currentView==='rosters')loadAllRosters(true)}}catch(err){}};ws.onclose=()=>{setConn('background','Riconnessione…');reconnectTimer=setTimeout(connect,1800)};ws.onerror=()=>setConn('offline','Problema di rete')}
document.addEventListener('visibilitychange',sendPresence);setInterval(sendPresence,8000);connect();
api('/api/state').then(({r,d})=>{if(r.ok)handleState(d)});if('serviceWorker'in navigator&&window.isSecureContext)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
