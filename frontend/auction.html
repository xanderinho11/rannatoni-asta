<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const token=localStorage.getItem('asta_token'),myTeam=localStorage.getItem('asta_team');if(!token||!myTeam)location.href='/';
const $=id=>document.getElementById(id);let state=null,ws=null,reconnectTimer=null,currentView='auction',timerInt=null,autoInt=null,toccaUiTimer=null,serverClockOffsetMs=0,lastNotifiedPid=null,lastRosterKey=null,lastAllRostersKey=null,selectedRosterTeam=null,modalLocked=false,pinLockShown=false,freeAgentData=null,freeRole='ALL',freeSort='quotazione',freeDesc=true,freeQuery='',releaseSelected=new Set(),releaseSelectionKey=null,bidDraftKey='',bidDraftValue='',bidDraftFocused=false,chatMessages=[],chatOpen=false,wsGeneration=0,lastWsMessageAt=0,lastPongAt=0,stateSyncInFlight=false,versionPollInFlight=false,lastForcedReconnectAt=0,lastStateVersion=0;const TOCCA_DEFAULT_MS=5200,TOCCA_WINNER_HOLD_MS=1300,WS_STALE_MS=11000,WS_HEARTBEAT_MS=4000,STATE_VERSION_POLL_MS=1000;
$('teamName').textContent=myTeam;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function clear(x){x.replaceChildren()}
function detail(d){if(!d)return'Operazione non riuscita.';if(typeof d.detail==='string')return d.detail;if(d.detail&&d.detail.message)return d.detail.message;return'Operazione non riuscita.'}
async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{}, {'Authorization':'Bearer '+token});const r=await fetch(path,opts);let d=null;const ct=r.headers.get('content-type')||'';if(ct.includes('application/json')){try{d=await r.json()}catch(e){}}if(r.status===401||(r.status===403&&d&&d.detail==='Squadra non piu\' valida.')){localStorage.removeItem('asta_token');localStorage.removeItem('asta_team');localStorage.removeItem('asta_manager');location.href='/'}return{r,d}}
function toast(text,error=false){const t=$('toast');t.textContent=text;t.className='toast'+(error?' error-toast':'');clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setConn(status,text){$('connDot').className='presence '+status;$('connText').textContent=text}
function roleLabel(r){return r==='P'?'POR':r==='Dd'?'DD':r==='Dc'?'DC':r==='Ds'?'DS':r==='Pc'?'PC':String(r||'').toUpperCase()}
function chipLabel(r){return r==='P'?'P':roleLabel(r)}
const ROLE_ORDER=['P','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc'];
function firstRole(g){return (g&&g.roles&&g.roles[0])||'X'}
function sortRoster(list){return [...list].sort((a,b)=>{const ai=ROLE_ORDER.indexOf(firstRole(a)),bi=ROLE_ORDER.indexOf(firstRole(b));return (ai<0?99:ai)-(bi<0?99:bi)||a.name.localeCompare(b.name,'it')})}
function roleBadges(roles){const stack=el('div','role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}
function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function avatarBlock(g){const wrap=el('div','avatar-wrap');let face;if(g.img){face=document.createElement('img');face.className='avatar';face.alt='';face.src=g.img;face.onerror=()=>{const fb=el('div','avatar-fallback',initials(g.name));face.replaceWith(fb);face=fb}}else face=el('div','avatar-fallback',initials(g.name));wrap.append(face,roleBadges(g.roles));return wrap}
function playerName(g,cls='name'){const label=(g?.name||'—')+(g?.out_of_league?' *':'');const node=el('div',cls+(g?.out_of_league?' out-of-league-name':''),label);if(g?.out_of_league){node.title='Fuori campionato';node.setAttribute('aria-label',label+' · Fuori campionato')}return node}
function appendOutOfLeagueLegend(list){if(list.querySelector('.out-of-league-name'))list.appendChild(el('div','tiny muted','* Fuori campionato: non disponibile per l’asta.'))}
function statsAvatarBlock(g){const wrap=avatarBlock(g),face=wrap.querySelector('.avatar,.avatar-fallback');if(face){face.classList.add('stats-photo');face.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(g)}}return wrap}function playerRow(g,{checkbox=false,checked=false,onChange=null,disabled=false,note=''}={}){const row=el('div','player-row'+(disabled?' release-locked-row':''));const entry=el('div','player-entry grow');if(checkbox){const lab=el('label','checkbox-line grow');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!checked&&!disabled;cb.disabled=!!disabled;const inner=el('div','player-entry grow');inner.append(statsAvatarBlock(g));const txt=el('div','grow');txt.append(playerName(g,'name'),el('div','meta',g.club||''));if(note)txt.appendChild(el('div','release-lock-note',note));inner.append(txt);lab.append(cb,inner);entry.append(lab);if(onChange)cb.onchange=()=>onChange(cb.checked,g)}else{entry.append(statsAvatarBlock(g));const txt=el('div','grow');txt.append(playerName(g,'name'),el('div','meta',g.club||''));entry.append(txt)}row.append(entry,el('span','price',String(g.price)));return row}
function participantStatus(t){if(t.market_finished)return'Mercato concluso';return({online:'Online',background:'In background',offline:'Offline'})[t.presence]||t.presence}
function teamMeta(t,status=''){const parts=[];if(t?.username)parts.push('@'+t.username);if(status)parts.push(status);return parts.join(' · ')}
function winnerIdentity(team,username,cls='last-result-winner'){const wrap=el('div','winner-identity');wrap.appendChild(el('div',cls,`🏆 ${team||'—'}`));if(username)wrap.appendChild(el('div','winner-username','@'+username));return wrap}
function activeTeams(){return(state?.teams||[]).filter(t=>!t.market_finished)}
function teamLine(t,response){const row=el('div','team-line');const left=el('div','team-main');left.append(el('span','presence '+(t.market_finished?'offline':t.presence)));const txt=el('div');txt.append(el('div','team-name',t.name+(t.is_manager?' 👑':'')),el('div','team-meta',teamMeta(t,participantStatus(t))));left.append(txt);const right=el('div');if(t.market_finished)right.appendChild(el('span','badge gray','🏁 Finito'));else if(response==='submitted')right.appendChild(el('span','badge green','✓ Risposto'));else if(response==='waiting')right.appendChild(el('span','badge gray','In attesa'));else right.appendChild(el('span',t.ready?'badge green':'badge gray',t.ready?'✓ In asta':'Non entrato'));row.append(left,right);return row}
function updateHeader(){if(!state?.me)return;$('teamName').textContent=state.me.team||myTeam;$('budgetVal').textContent=state.me.budget;$('rosterCount').textContent=`${state.me.roster_size}/${state.me.max_roster}`;$('teamLabel').textContent=state.me.is_manager?'Gestore Rannatoni':'Rannatone'}
function rosterKey(s){return s?.me?`${s.catalog_revision||'0'}:${s.me.roster_signature||''}:${s.me.budget}`:null}
function setView(name){currentView=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));['auction','roster','rosters','free','history','lobby'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));if(name==='roster')loadRoster(false);if(name==='rosters')loadAllRosters(false);if(name==='free')loadFreeAgents(false);if(name==='history')loadHistory();if(name==='lobby')renderLobby();if(name==='auction')renderAuction()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function openModal(title,bodyNodes=[],actions=[],locked=false){modalLocked=locked;const m=$('modalCard');clear(m);m.appendChild(el('div','modal-title',title));const nodes=Array.isArray(bodyNodes)?bodyNodes:[bodyNodes];nodes.filter(Boolean).forEach(n=>m.appendChild(typeof n==='string'?el('p','small muted',n):n));if(actions.length){const a=el('div','modal-actions stack-mobile');actions.forEach(x=>{const b=el('button',x.className||'btn-ghost',x.text);b.onclick=x.onClick;a.appendChild(b)});m.appendChild(a)}$('modal').classList.remove('hidden')}
function closeModal(force=false){if(modalLocked&&!force)return;$('modal').classList.add('hidden');modalLocked=false}$('modal').onclick=e=>{if(e.target===$('modal')&&!modalLocked)closeModal()};
const STAT_LABEL_FALLBACK={media_voto:'Media voto',fantamedia:'Fantamedia',quotazione:'Quotazione',presenze:'Presenze'};
const PLAYER_STATS_MAIN=['media_voto','fantamedia','quotazione','presenze'];
const PLAYER_STATS_EXTRA=[];
function statValue(v){return typeof v==='number'?String(v).replace('.',','):String(v??'—')}
function hasStat(stats,key){return stats[key]!==undefined&&stats[key]!==null&&stats[key]!==''}
async function showPlayerStats(g){if(!g?.pid)return;let player=g,labels={};try{const{r,d}=await api('/api/player/'+encodeURIComponent(g.pid));if(r.ok&&d?.player){player=d.player;labels=d.stat_labels||{}}}catch(e){}const body=el('div','player-detail-body');const head=el('div','player-detail-head');head.appendChild(avatarBlock(player));const txt=el('div','grow');txt.append(playerName(player,'player-detail-name'));if(player.full_name&&player.full_name!==player.name)txt.appendChild(el('div','tiny muted',player.full_name));txt.appendChild(el('div','meta',player.club||''));head.appendChild(txt);body.appendChild(head);if(player.out_of_league)body.appendChild(el('div','notice','* Fuori campionato: non disponibile per l’asta.'));const stats=player.stats||{};const mainKeys=PLAYER_STATS_MAIN.filter(k=>hasStat(stats,k));const extraKeys=PLAYER_STATS_EXTRA.filter(k=>hasStat(stats,k));if(mainKeys.length||extraKeys.length){if(mainKeys.length){const grid=el('div','stats-grid');mainKeys.forEach(k=>{const card=el('div','stat-card');card.append(el('span','',k==='quotazione'&&hasStat(stats,'quotazione_mantra')?'Quotazione Mantra':STAT_LABEL_FALLBACK[k]||labels[k]||k.replaceAll('_',' ')),el('strong','',statValue(stats[k])));grid.appendChild(card)});body.appendChild(grid)}if(extraKeys.length){const mini=el('div','stats-secondary');extraKeys.forEach(k=>{const card=el('div','stat-mini');card.append(el('span','',STAT_LABEL_FALLBACK[k]||labels[k]||k),el('strong','',statValue(stats[k])));mini.appendChild(card)});body.appendChild(mini)}}else body.appendChild(el('div','notice','Statistiche essenziali non disponibili per questo calciatore.'));openModal('Scheda calciatore',body,[{text:'Chiudi',onClick:closeModal}])}

function heroRoleBadges(roles){const stack=el('div','hero-role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip hero-role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}function playerHero(p){const hero=el('div','player-hero');const avatar=el('div','hero-avatar-wrap');let face;if(p?.img){face=document.createElement('img');face.src=p.img;face.alt='';face.onerror=()=>{const fb=el('div','hero-fallback stats-photo',initials(p.name));fb.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(p)};face.replaceWith(fb);face=fb}}else face=el('div','hero-fallback',initials(p?.name));if(p?.pid){face.classList.add('stats-photo');face.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(p)}}avatar.append(face,heroRoleBadges(p?.roles));hero.append(avatar,playerName(p,'player-name'),el('div','player-club',p?.club||''));return hero}function progressLine(){const pr=state?.auction_progress||{};const total=Number(pr.total)||0,done=Number(pr.auctioned)||0;return el('div','auction-progress',total?`${done} / ${total} astati`:`${done} astati`)}

function renderPreStartLobby(box){clear(box);if(!state)return;const teams=(state.teams||[]).filter(t=>!t.market_finished),entered=teams.filter(t=>t.ready).length,total=teams.length;const c=el('section','card accent');c.append(el('div','eyebrow','🏟️ Lobby Rannatoni'),el('h2','','L’asta non è ancora iniziata'),el('p','small muted','In attesa che l’Admin avvii l’asta.'));c.appendChild(el('div',entered===total&&total?'notice ok':'notice',`🟢 ${entered} / ${total} Rannatoni pronti`));teams.forEach(t=>{const row=el('div','team-line');const left=el('div','team-main');left.append(el('span','presence '+(t.ready?t.presence:'offline')));const txt=el('div');const status=t.ready?participantStatus(t):'Non ha ancora effettuato l’accesso';txt.append(el('div','team-name',t.name+(t.is_manager?' 👑':'')),el('div','team-meta',teamMeta(t,status)));left.appendChild(txt);row.append(left,el('span',t.ready?'badge green':'badge gray',t.ready?'✓ Pronto':'Deve accedere'));c.appendChild(row)});box.appendChild(c);if(state.me?.is_manager){const n=el('section','card compact');n.appendChild(el('div','notice','ℹ️ L’avvio ufficiale dell’asta si effettua dal pannello Super Admin.'));const b=el('button','btn-ghost btn-block','⚙️ Vai al Super Admin');b.style.marginTop='8px';b.onclick=()=>location.href='/admin';n.appendChild(b);const sim=el('button','btn-ghost btn-block','🧪 Avvia simulazione');sim.style.marginTop='8px';sim.onclick=toggleSimulation;n.appendChild(sim);box.appendChild(n)}}
function renderLobby(){const box=$('view-lobby');clear(box);if(!state)return;if(!state.auction_started&&!state.simulation){renderPreStartLobby(box);return}const active=activeTeams(),entered=active.filter(t=>t.ready).length,total=active.length;const c=el('section','card');const h=el('div','row between');const title=el('div');title.append(el('div','eyebrow','Lobby Rannatoni'),el('h2','',`${entered}/${total} in asta`));h.append(title,el('span',entered===total&&total?'badge green':'badge',entered===total&&total?'Tutti entrati':'Accessi in corso'));c.appendChild(h);state.teams.forEach(t=>c.appendChild(teamLine(t)));box.appendChild(c);if(state.me){const own=el('section','card accent');if(state.me.market_finished){own.append(el('h2','','🏁 Hai concluso il mercato'),el('p','small muted','Se rientri puoi seguire l’asta in sola consultazione finché il gestore non ti riattiva.'))}else{own.append(el('h2','','✅ Sei nell’asta'),el('p','small muted','Dal login resti automaticamente attivo anche se chiudi l’app o vai in background. Esci dal mercato solo con “Ho finito gli acquisti”.'))}box.prepend(own)}}

function renderAuction(){clearInterval(timerInt);clearInterval(autoInt);clearTimeout(toccaUiTimer);const box=$('view-auction');clear(box);if(!state)return;if(!state.auction_started&&!state.simulation){renderPreStartLobby(box);return}if(state.simulation)box.appendChild(el('div','notice warn','🧪 MODALITÀ SIMULAZIONE — al termine tornerà lo stato reale.'));if(state.mode==='tocca'){renderTocca(box);return}if(state.mode==='release'&&toccaWinnerHoldActive(state.last_result)){renderTocca(box,true);const wait=Math.max(80,toccaWinnerHoldRemaining(state.last_result));toccaUiTimer=setTimeout(()=>{if(currentView==='auction')renderAuction()},wait);return}if(state.mode==='idle')renderIdle(box);else if(state.mode==='bidding'||state.mode==='tiebreak')renderBidding(box);else if(state.mode==='release')renderRelease(box)}
function renderIdle(box){if(state.last_result&&(state.last_result.type==='assigned'||state.last_result.type==='no_offers'))box.appendChild(resultCard(state.last_result));else{const waiting=el('section','card accent');waiting.append(el('div','eyebrow','Asta Rannatoni'),el('h2','','Asta avviata'),el('p','small muted','In attesa della prossima estrazione.'));box.appendChild(waiting)}if(state.random_pool?.empty_message)box.appendChild(el('div','notice warn',state.random_pool.empty_message));const reserveAuto=Number(state.random_pool?.eligible_count??1)>0&&(state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined||(state.last_result?.tocca&&state.auto_random&&Number(state.active_market_count||0)>0));if(reserveAuto){const c=el('section','card compact accent auto-random-card');const line=el('div','row between');line.append(el('div','auto-random-label','⚡ Prossima RANDOM automatica'),el('div','auto-count',state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined?String(state.auto_random_seconds):'…'));c.appendChild(line);if(state.me.is_manager){const stop=el('button','btn-ghost btn-block','⏸ Ferma questa estrazione');stop.style.marginTop='8px';stop.onclick=skipNextAutoRandom;c.appendChild(stop)}box.appendChild(c);if(state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined)startAutoCountdown(state.auto_random_seconds)}if(state.me.market_finished){const c=el('section','card compact');c.appendChild(el('div','notice','🏁 Hai concluso gli acquisti: puoi seguire l’asta ma non partecipare.'));box.appendChild(c)}else if(!state.me.ready){const c=el('section','card compact');c.appendChild(el('div','notice','Accesso registrato: stai entrando automaticamente nel mercato…'));box.appendChild(c)}if(state.me.is_manager)box.appendChild(managerIdleControls())}
function startAutoCountdown(v){let n=Number(v)||0;const tick=()=>{const target=document.querySelector('.auto-count');if(target)target.textContent=String(Math.max(0,n));n--};tick();autoInt=setInterval(tick,1000)}function syncRandomIdleRealtime(){const card=document.querySelector('.auto-random-card'),target=card?.querySelector('.auto-count'),label=card?.querySelector('.auto-random-label');if(!card||!target)return;clearInterval(autoInt);if(!state?.auto_random){target.textContent='—';if(label)label.textContent='⏸ RANDOM automatico fermato';return}if(state.auto_random_seconds!==null&&state.auto_random_seconds!==undefined){if(label)label.textContent='⚡ Prossima RANDOM automatica';startAutoCountdown(state.auto_random_seconds)}else target.textContent='…'}
function managerIdleControls(){const c=el('section','card accent');c.append(el('div','eyebrow','Gestione asta'),el('h2','','Prossimo giocatore'));const active=activeTeams(),entered=active.filter(t=>t.ready).length,total=active.length;c.appendChild(el('div',entered?'notice ok':'notice warn',entered?`In asta ${entered}/${total}. La prossima busta coinvolgerà chi è già entrato e non ha concluso il mercato.`:'Nessun Rannatone è ancora entrato nel mercato: non puoi avviare una busta.'));const toggle=el('div','toggle-row');const tx=el('div');tx.append(el('div','team-name','⚡ RANDOM automatico'),el('div','team-meta',state.auto_random?'Dopo ogni asta parte il prossimo giocatore.':'Avvio manuale tra un giocatore e l’altro.'));const sw=el('button','switch'+(state.auto_random?' on':''));sw.setAttribute('aria-label','RANDOM automatico');sw.onclick=()=>setAutoRandom(!state.auto_random);toggle.append(tx,sw);c.appendChild(toggle);const pool=state.random_pool;if(pool)c.appendChild(el('div','small muted',`Quotazione attuale Mantra minima: ${pool.min_quotation} · Estraibili: ${pool.eligible_count}${pool.released_exception_count?' · Svincolati ammessi sotto soglia o senza quotazione: '+pool.released_exception_count:''}`));const random=el('button','btn-primary btn-block','🎲 Estrai RANDOM');random.disabled=pool?.eligible_count===0;random.onclick=()=>openRandom();c.appendChild(random);c.appendChild(el('div','center tiny muted','oppure cerca un giocatore'));const inp=el('input','input');inp.placeholder='Cerca giocatore…';inp.style.marginTop='8px';const results=el('div','search-results');let debounce;inp.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>searchPlayers(inp.value,results),180)};c.append(inp,results);c.appendChild(el('div','hr'));const row=el('div','button-row stack-mobile');const undo=el('button','btn-ghost','↩️ Annulla ultima assegnazione');undo.onclick=undoLast;const more=el('button','btn-ghost','⋯ Altri comandi');more.onclick=openManagerTools;row.append(undo,more);c.appendChild(row);return c}
async function setAutoRandom(enabled){const{r,d}=await api('/api/auction/admin/auto-random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});if(!r.ok)toast(detail(d),true)}
async function skipNextAutoRandom(){const{r,d}=await api('/api/auction/admin/auto-random/skip',{method:'POST'});if(!r.ok)toast(detail(d),true);else toast('Prossima estrazione fermata')}
async function openRandom(){const{r,d}=await api('/api/auction/admin/random',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});if(!r.ok)toast(detail(d),true)}
