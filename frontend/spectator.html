<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const token=localStorage.getItem('asta_spectator_token');if(!token)location.href='/';const $=id=>document.getElementById(id);let state=null,ws=null,reconnectTimer=null,currentView='auction',timerInt=null,selectedRosterTeam=null,lastAllRostersKey=null,freeAgentData=null,freeRole='ALL',freeSort='quotazione',freeDesc=true,freeQuery='';
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function clear(x){x.replaceChildren()}function setConn(s,t){$('connDot').className='presence '+s;$('connText').textContent=t}function roleLabel(r){return r==='P'?'POR':r==='Dd'?'DD':r==='Dc'?'DC':r==='Ds'?'DS':r==='Pc'?'PC':String(r||'').toUpperCase()}function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}const ROLE_ORDER=['P','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc'];function firstRole(g){return(g&&g.roles&&g.roles[0])||'X'}function sortRoster(list){return[...list].sort((a,b)=>{const ai=ROLE_ORDER.indexOf(firstRole(a)),bi=ROLE_ORDER.indexOf(firstRole(b));return(ai<0?99:ai)-(bi<0?99:bi)||a.name.localeCompare(b.name,'it')})}function chipLabel(r){return r==='P'?'P':roleLabel(r)}function roleBadges(roles){const stack=el('div','role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}function avatarBlock(g){const wrap=el('div','avatar-wrap');let face;if(g.img){face=document.createElement('img');face.className='avatar';face.alt='';face.src=g.img;face.onerror=()=>{const fb=el('div','avatar-fallback',initials(g.name));face.replaceWith(fb);face=fb}}else face=el('div','avatar-fallback',initials(g.name));wrap.append(face,roleBadges(g.roles));return wrap}function statsAvatarBlock(g){const wrap=avatarBlock(g),face=wrap.querySelector('.avatar,.avatar-fallback');if(face){face.classList.add('stats-photo');face.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(g)}}return wrap}function playerRow(g){const row=el('div','player-row');const entry=el('div','player-entry grow');entry.append(statsAvatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));entry.append(txt);row.append(entry,el('span','price',String(g.price)));return row}
async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{},{'Authorization':'Bearer '+token});const r=await fetch(path,opts);let d=null;try{d=await r.json()}catch(e){}if(r.status===401){localStorage.removeItem('asta_spectator_token');location.href='/'}return{r,d}}
const STAT_LABEL_FALLBACK={media_voto:'Media voto',fantamedia:'Fantamedia',quotazione:'Quotazione'};
const PLAYER_STATS_MAIN=['media_voto','fantamedia','quotazione'];
const PLAYER_STATS_EXTRA=[];
function statValue(v){return typeof v==='number'?String(v).replace('.',','):String(v??'—')}
function hasStat(stats,key){return stats[key]!==undefined&&stats[key]!==null&&stats[key]!==''}
async function showPlayerStats(g){if(!g?.pid)return;let player=g,labels={};try{const{r,d}=await api('/api/spectator/player/'+encodeURIComponent(g.pid));if(r.ok&&d?.player){player=d.player;labels=d.stat_labels||{}}}catch(e){}const body=el('div','player-detail-body');const head=el('div','player-detail-head');head.appendChild(avatarBlock(player));const txt=el('div','grow');txt.append(el('div','player-detail-name',player.name||'—'));if(player.full_name&&player.full_name!==player.name)txt.appendChild(el('div','tiny muted',player.full_name));txt.appendChild(el('div','meta',player.club||''));head.appendChild(txt);body.appendChild(head);const stats=player.stats||{};const mainKeys=PLAYER_STATS_MAIN.filter(k=>hasStat(stats,k));const extraKeys=PLAYER_STATS_EXTRA.filter(k=>hasStat(stats,k));if(mainKeys.length||extraKeys.length){if(mainKeys.length){const grid=el('div','stats-grid');mainKeys.forEach(k=>{const card=el('div','stat-card');card.append(el('span','',STAT_LABEL_FALLBACK[k]||labels[k]||k.replaceAll('_',' ')),el('strong','',statValue(stats[k])));grid.appendChild(card)});body.appendChild(grid)}if(extraKeys.length){const mini=el('div','stats-secondary');extraKeys.forEach(k=>{const card=el('div','stat-mini');card.append(el('span','',STAT_LABEL_FALLBACK[k]||labels[k]||k),el('strong','',statValue(stats[k])));mini.appendChild(card)});body.appendChild(mini)}}else body.appendChild(el('div','notice','Statistiche essenziali non disponibili per questo calciatore.'));const card=$('modalCard');clear(card);card.append(el('div','modal-title','Scheda calciatore'),body);const close=el('button','btn-ghost btn-block','Chiudi');close.style.marginTop='14px';close.onclick=closeModal;card.appendChild(close);$('modal').classList.remove('hidden')}

function heroRoleBadges(roles){const stack=el('div','hero-role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip hero-role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}function playerHero(p){const hero=el('div','player-hero');const avatar=el('div','hero-avatar-wrap');let face;if(p?.img){face=document.createElement('img');face.src=p.img;face.alt='';face.onerror=()=>{const fb=el('div','hero-fallback stats-photo',initials(p.name));fb.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(p)};face.replaceWith(fb);face=fb}}else face=el('div','hero-fallback',initials(p?.name));if(p?.pid){face.classList.add('stats-photo');face.onclick=e=>{e.preventDefault();e.stopPropagation();showPlayerStats(p)}}avatar.append(face,heroRoleBadges(p?.roles));hero.append(avatar,el('div','player-name',p?.name||'—'),el('div','player-club',p?.club||''));return hero}function progressLine(){const pr=state?.auction_progress||{};const total=Number(pr.total)||0,done=Number(pr.auctioned)||0;return el('div','auction-progress',total?`${done} / ${total} astati`:`${done} astati`)}
function timerBlock(){const d=el('div','timer');const strong=el('strong','',String(state.seconds_left??0));strong.id='timerVal';const label=el('div','tiny muted',state.paused?'IN PAUSA':'secondi');const line=el('div','timer-line');const fill=el('div','timer-fill');fill.id='timerFill';line.appendChild(fill);d.append(strong,label,line);startTimer(state.seconds_left??0,state.duration||60);return d}function startTimer(v,total){clearInterval(timerInt);let n=Math.max(0,Number(v)||0);const update=()=>{const x=$('timerVal'),f=$('timerFill');if(x){x.textContent=String(Math.ceil(n));x.classList.toggle('urgent',n<=10)}if(f){f.style.width=`${Math.max(0,Math.min(100,n/total*100))}%`;f.classList.toggle('urgent',n<=10)}if(!state?.paused)n=Math.max(0,n-1)};update();timerInt=setInterval(update,1000)}
function appendReleased(container,released){if(!released?.length)return;const det=document.createElement('details');det.className='result-detail release-detail';const sum=document.createElement('summary');sum.className='result-detail-summary';sum.append(el('span','',`📦 Svincolati · ${released.length}`),el('span','detail-chevron','⌄'));det.appendChild(sum);const list=el('div','player-list result-player-list');released.forEach(g=>list.appendChild(playerRow(g)));det.appendChild(list);container.appendChild(det)}function appendOffers(container,reveal){if(!reveal)return;const entries=Object.entries(reveal);const det=document.createElement('details');det.className='result-detail offers-detail';const sum=document.createElement('summary');sum.className='result-detail-summary';sum.append(el('span','',`💸 Offerte · ${entries.length}`),el('span','detail-chevron','⌄'));det.appendChild(sum);const grid=el('div','offer-grid');entries.sort((a,b)=>b[1]-a[1]).forEach(([team,v])=>{const row=el('div','offer-row');row.append(el('span','',team),el('span','price',v===0?'PASSO':String(v)));grid.appendChild(row)});det.appendChild(grid);container.appendChild(det)}
function resultCard(r){const c=el('section','card result');c.appendChild(el('div','eyebrow','Ultimo risultato'));const g={pid:r.pid,name:r.player_name||'Giocatore',full_name:r.player_full_name||r.player_name||'',roles:r.player_roles||[],club:r.player_club||'',img:r.player_img||'',stats:r.player_stats||{}};const line=el('div','last-result-player');const left=el('div','player-entry grow');left.appendChild(statsAvatarBlock(g));const txt=el('div','grow');txt.append(el('div','last-result-name',g.name),el('div','meta',g.club||''));left.appendChild(txt);const out=el('div','last-result-outcome');if(r.type==='no_offers'){out.appendChild(el('span','badge gray','⏭️ PASSATO'))}else{const icon=r.tocca?'🎲':'🏆';out.append(el('div','last-result-winner',`${icon} ${r.team}`),el('div','last-result-price',String(r.price)))}line.append(left,out);c.appendChild(line);if(r.type==='no_offers'){c.appendChild(el('div','all-pass-message','👋 Tutti i Rannatoni hanno passato'));return c}if(r.tocca)c.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · spareggio chiuso in parità'));appendReleased(c,r.released);if(r.reveal)appendOffers(c,r.reveal);return c}
function renderPreStartLobby(box){const teams=(state.teams||[]).filter(t=>!t.market_finished),entered=teams.filter(t=>t.ready).length,total=teams.length;const c=el('section','card accent');c.append(el('div','eyebrow','🏟️ Lobby Rannatoni'),el('h2','','L’asta non è ancora iniziata'),el('p','small muted','In attesa che l’Admin avvii l’asta.'));c.appendChild(el('div',entered===total&&total?'notice ok':'notice',`🟢 ${entered} / ${total} Rannatoni pronti`));teams.forEach(t=>{const row=el('div','team-line');const left=el('div','team-main');left.append(el('span','presence '+(t.ready?t.presence:'offline')));const txt=el('div');txt.append(el('div','team-name',t.name+(t.is_manager?' 👑':'')),el('div','team-meta',t.ready?'Ha già effettuato l’accesso':'Non ha ancora effettuato l’accesso'));left.appendChild(txt);row.append(left,el('span',t.ready?'badge green':'badge gray',t.ready?'✓ Pronto':'Deve accedere'));c.appendChild(row)});box.appendChild(c)}
function renderAuction(){clearInterval(timerInt);const box=$('view-auction');clear(box);if(!state)return;if(!state.auction_started&&!state.simulation){renderPreStartLobby(box);return}if(state.simulation)box.appendChild(el('div','notice warn','🧪 MODALITÀ SIMULAZIONE'));if(state.mode==='idle'){if(state.last_result)box.appendChild(resultCard(state.last_result));const c=el('section','card accent');c.append(el('div','eyebrow','Asta Rannatoni'),el('h2','','In attesa della prossima estrazione'));const active=(state.teams||[]).filter(t=>!t.market_finished);c.appendChild(el('div','notice',`${active.filter(t=>t.ready).length}/${active.length} Rannatoni in asta`));box.appendChild(c);return}if(state.mode==='bidding'||state.mode==='tiebreak'){const c=el('section','card accent');c.appendChild(playerHero(state.current_player));c.appendChild(progressLine());c.appendChild(timerBlock());if(state.mode==='tiebreak')c.appendChild(el('div','notice warn',`⚔️ Spareggio a ${state.tiebreak_value}: ${(state.eligible_teams||[]).join(', ')}`));box.appendChild(c);const status=el('section','card');status.append(el('div','eyebrow','Buste'),el('h2','',`${state.submitted.length}/${state.eligible_teams.length} risposte`),el('p','small muted','Le cifre restano segrete fino all’apertura delle buste.'));box.appendChild(status);return}if(state.mode==='release'){const c=el('section','card');if(state.current_player)c.appendChild(playerHero(state.current_player));c.append(el('h2','',`💰 ${state.release_public?.team||'Il vincitore'} sta effettuando gli svincoli`),el('p','muted small','Il risultato definitivo comparirà appena l’acquisto sarà completato.'));box.appendChild(c)}}
async function loadAllRosters(preserve=true){const box=$('view-rosters'),y=preserve?window.scrollY:0;if(!preserve){clear(box);box.appendChild(el('div','notice','Caricamento rose…'))}const{r,d}=await api('/api/spectator/rosters');if(!r.ok)return;clear(box);lastAllRostersKey=(d.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|');if(selectedRosterTeam){const team=(d.teams||[]).find(t=>t.name===selectedRosterTeam);if(!team){selectedRosterTeam=null;return loadAllRosters(false)}const back=el('button','btn-ghost btn-sm','← Tutte le rose');back.onclick=()=>{selectedRosterTeam=null;loadAllRosters(false)};const head=el('section','card compact');head.append(back,el('div','eyebrow','Rosa Rannatoni'),el('h2','',team.name),el('div','roster-summary',`${team.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-team.roster_size)} posti liberi · ${team.budget}`));box.appendChild(head);const list=el('section','card player-list');sortRoster((d.rosters||{})[team.name]||[]).forEach(g=>list.appendChild(playerRow(g)));box.appendChild(list)}else{const head=el('section','card compact');head.append(el('div','eyebrow','Rannatoni'),el('h2','','Tutte le rose'),el('p','small muted','Tocca una squadra per vedere i giocatori.'));box.appendChild(head);const list=el('section','card');(d.teams||[]).forEach(t=>{const row=el('button','roster-team-row');const left=el('div','grow');left.append(el('div','team-name',t.name+(t.market_finished?' 🏁':'')),el('div','team-meta',`${t.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-t.roster_size)} posti liberi`));row.append(left,el('span','roster-budget',String(t.budget)));row.onclick=()=>{selectedRosterTeam=t.name;loadAllRosters(false)};list.appendChild(row)});box.appendChild(list)}if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}
function normalizeSearch(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function freeMetric(g,key){if(key==='name')return null;const v=(g.stats||{})[key];return v===undefined||v===null||v===''?null:Number(v)}
function freeAgentRow(g,sortKey,sortLabel){const row=el('div','player-row free-player-row');const entry=el('div','player-entry grow');entry.append(statsAvatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));entry.appendChild(txt);const right=el('div','free-metric');const value=freeMetric(g,sortKey);if(value!==null){right.append(el('strong','',String(value).replace('.',',')),el('span','',sortLabel||''))}if(g.passed)right.appendChild(el('span','badge gray free-passed','PASSATO'));row.append(entry,right);return row}
async function loadFreeAgents(preserve=true){const box=$('view-free'),y=preserve?window.scrollY:0;if(!preserve&&!freeAgentData){clear(box);box.appendChild(el('div','notice','Caricamento svincolati…'))}const{r,d}=await api('/api/spectator/free-agents');if(!r.ok)return;freeAgentData=d||{players:[],sort_fields:[]};if(!(freeAgentData.sort_fields||[]).some(x=>x.key===freeSort))freeSort=(freeAgentData.sort_fields?.[0]?.key)||'name';renderFreeAgents();if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}
function renderFreeAgents(){const box=$('view-free');clear(box);const data=freeAgentData||{players:[],sort_fields:[]};const head=el('section','card compact');head.append(el('div','eyebrow','Mercato'),el('h2','','Svincolati'));const search=el('input','input');search.type='search';search.placeholder='🔎 Cerca calciatore…';search.value=freeQuery;search.oninput=()=>{freeQuery=search.value;renderFreeList()};head.appendChild(search);const roles=el('div','role-filter-bar');const chooseRole=(role,b)=>{freeRole=role;roles.querySelectorAll('.role-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderFreeList();requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))};const all=el('button','role-filter all'+(freeRole==='ALL'?' active':''),'Tutti');all.onclick=()=>chooseRole('ALL',all);roles.appendChild(all);ROLE_ORDER.forEach(r=>{const b=el('button','role-filter role-filter-'+r+(freeRole===r?' active':''),chipLabel(r));b.onclick=()=>chooseRole(r,b);roles.appendChild(b)});head.appendChild(roles);requestAnimationFrame(()=>roles.querySelector('.role-filter.active')?.scrollIntoView({inline:'center',block:'nearest'}));const controls=el('div','free-controls');const select=document.createElement('select');select.className='input free-sort-select';(data.sort_fields||[]).forEach(f=>{const o=document.createElement('option');o.value=f.key;o.textContent=f.label;o.selected=f.key===freeSort;select.appendChild(o)});select.onchange=()=>{freeSort=select.value;freeDesc=freeSort!=='name';renderFreeList()};const dir=el('button','btn-ghost free-dir',freeDesc?'↓':'↑');dir.onclick=()=>{freeDesc=!freeDesc;dir.textContent=freeDesc?'↓':'↑';renderFreeList()};controls.append(select,dir);head.appendChild(controls);box.appendChild(head);const list=el('section','card player-list');list.id='freeList';box.appendChild(list);renderFreeList()}
function renderFreeList(){const list=$('freeList');if(!list||!freeAgentData)return;clear(list);const q=normalizeSearch(freeQuery);let players=(freeAgentData.players||[]).filter(g=>(freeRole==='ALL'||(g.roles||[]).includes(freeRole))&&(!q||normalizeSearch(g.name).includes(q)||normalizeSearch(g.full_name).includes(q)));const field=(freeAgentData.sort_fields||[]).find(f=>f.key===freeSort)||{key:'name',label:'Nome',numeric:false};players.sort((a,b)=>{if(field.key==='name'){const cmp=a.name.localeCompare(b.name,'it');return freeDesc?-cmp:cmp}const av=freeMetric(a,field.key),bv=freeMetric(b,field.key);if(av===null&&bv===null)return a.name.localeCompare(b.name,'it');if(av===null)return 1;if(bv===null)return-1;const cmp=av-bv;return freeDesc?-cmp:cmp});list.appendChild(el('div','tiny muted free-count',`${players.length} calciatori`));players.forEach(g=>list.appendChild(freeAgentRow(g,field.key,field.label)));if(!players.length)list.appendChild(el('p','muted small','Nessun calciatore trovato.'))}
function historyEventCard(ev){const det=document.createElement('details');det.className='history-card';const sum=document.createElement('summary');sum.className='history-summary';const g={pid:ev.pid,name:ev.player_name||'Giocatore',full_name:ev.player_full_name||ev.player_name||'',roles:ev.player_roles||[],club:ev.player_club||'',img:ev.player_img||'',stats:ev.player_stats||{}};const left=el('div','history-player grow');left.appendChild(statsAvatarBlock(g));const txt=el('div','grow');const nm=el('div','history-player-name',g.name);txt.append(nm);const meta=[];if(g.club)meta.push(g.club);meta.push(`${(ev.released||[]).length} svincoli`);meta.push(`${Object.keys(ev.reveal||{}).length} offerte`);txt.appendChild(el('div','history-player-meta',meta.join(' · ')));left.appendChild(txt);const out=el('div','history-outcome');if(ev.event_type==='no_offers'){out.appendChild(el('span','badge gray','PASSATO'))}else{out.append(el('div','history-winner','🏆 '+(ev.team||'—')),el('div','history-price',String(ev.price??'—')));if(ev.tocca)out.appendChild(el('span','badge random-mini','🎲 Casuale'))}sum.append(left,out);det.appendChild(sum);det.appendChild(el('div','tiny muted history-time',String(ev.ts||'').replace('T',' ')));if(ev.tocca)det.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · assegnato tramite sorteggio.'));appendReleased(det,ev.released);if(ev.event_type!=='no_offers'&&ev.reveal)appendOffers(det,ev.reveal);else if(ev.event_type==='no_offers')det.appendChild(el('div','all-pass-message history-all-pass','👋 Tutti i Rannatoni hanno passato'));return det}
async function loadHistory(){const box=$('view-history');clear(box);box.appendChild(el('div','notice','Caricamento storico…'));const{r,d}=await api('/api/spectator/history');clear(box);if(!r.ok)return;const h=el('section','card compact');h.append(el('div','eyebrow','Rannatoni'),el('h2','','Storico asta'));box.appendChild(h);if(!d.length){h.appendChild(el('p','muted small','Nessuna asta conclusa.'));return}(d||[]).forEach(ev=>box.appendChild(historyEventCard(ev)))}
function setView(name){currentView=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));['auction','rosters','free','history'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));if(name==='auction')renderAuction();if(name==='rosters')loadAllRosters(false);if(name==='free')loadFreeAgents(false);if(name==='history')loadHistory()}document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('exitBtn').onclick=()=>{const body=el('div');body.appendChild(el('div','notice','👀 Modalità spettatore'));const b=el('button','btn-danger btn-block','Disconnetti');b.onclick=logout;body.appendChild(b);const card=$('modalCard');clear(card);card.append(el('div','modal-title','Spettatore'),body);$('modal').classList.remove('hidden')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};async function logout(){try{await api('/api/logout',{method:'POST'})}catch(e){}localStorage.removeItem('asta_spectator_token');location.href='/'}
function allRostersKey(s){return(s?.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|')}function handleState(s){const old=allRostersKey(state);state=s;if(currentView==='auction')renderAuction();else if(currentView==='rosters'&&allRostersKey(s)!==old&&allRostersKey(s)!==lastAllRostersKey)loadAllRosters(true);else if(currentView==='free'&&allRostersKey(s)!==old)loadFreeAgents(true)}function sendPing(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',visibility:document.visibilityState}))}function connect(){clearTimeout(reconnectTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onopen=()=>{setConn('online','Connesso');sendPing()};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handleState(m.data);if(m.type==='result'){if(currentView==='history')loadHistory();if(currentView==='rosters')loadAllRosters(true);if(currentView==='free')loadFreeAgents(true)}}catch(err){}};ws.onclose=()=>{setConn('background','Riconnessione…');reconnectTimer=setTimeout(connect,1800)};ws.onerror=()=>setConn('offline','Problema di rete')}document.addEventListener('visibilitychange',sendPing);setInterval(sendPing,8000);connect();api('/api/spectator/state').then(({r,d})=>{if(r.ok)handleState(d)});
</script></body></html>
