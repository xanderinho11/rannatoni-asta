<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12091f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rannatoni · Spettatore</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="/static/style.css">
</head><body><main class="app">
<div class="topbar"><div><div class="eyebrow">Rannatoni</div><div class="brand">👀 Spettatore</div><div class="tiny muted"><span id="connDot" class="presence offline"></span> <span id="connText">Connessione…</span></div></div><button id="exitBtn" class="btn-ghost btn-icon" aria-label="Esci">⋯</button></div>
<section id="view-auction"></section><section id="view-rosters" class="hidden"></section><section id="view-history" class="hidden"></section>
</main><nav class="bottom-nav spectator-nav"><button class="nav-btn active" data-view="auction"><span class="ico">⚽</span>Asta</button><button class="nav-btn" data-view="rosters"><span class="ico">👥</span>Rose</button><button class="nav-btn" data-view="history"><span class="ico">📜</span>Storico</button></nav>
<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const token=localStorage.getItem('asta_spectator_token');if(!token)location.href='/';const $=id=>document.getElementById(id);let state=null,ws=null,reconnectTimer=null,currentView='auction',timerInt=null,selectedRosterTeam=null,lastAllRostersKey=null;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function clear(x){x.replaceChildren()}function setConn(s,t){$('connDot').className='presence '+s;$('connText').textContent=t}function roleLabel(r){return r==='P'?'POR':r==='Dd'?'DD':r==='Dc'?'DC':r==='Ds'?'DS':r==='Pc'?'PC':String(r||'').toUpperCase()}function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}const ROLE_ORDER=['P','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc'];function firstRole(g){return(g&&g.roles&&g.roles[0])||'X'}function sortRoster(list){return[...list].sort((a,b)=>{const ai=ROLE_ORDER.indexOf(firstRole(a)),bi=ROLE_ORDER.indexOf(firstRole(b));return(ai<0?99:ai)-(bi<0?99:bi)||a.name.localeCompare(b.name,'it')})}function chipLabel(r){return r==='P'?'P':roleLabel(r)}function roleBadges(roles){const stack=el('div','role-stack');(roles||[]).slice(0,3).forEach(r=>stack.appendChild(el('span','role-chip role-'+(ROLE_ORDER.includes(r)?r:'X'),chipLabel(r))));return stack}function avatarBlock(g){const wrap=el('div','avatar-wrap');let face;if(g.img){face=document.createElement('img');face.className='avatar';face.alt='';face.src=g.img;face.onerror=()=>{const fb=el('div','avatar-fallback',initials(g.name));face.replaceWith(fb);face=fb}}else face=el('div','avatar-fallback',initials(g.name));wrap.append(face,roleBadges(g.roles));return wrap}function playerRow(g){const row=el('div','player-row');const entry=el('div','player-entry grow');entry.append(avatarBlock(g));const txt=el('div','grow');txt.append(el('div','name',g.name),el('div','meta',g.club||''));entry.append(txt);row.append(entry,el('span','price',`${g.price} cr`));return row}
async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{},{'Authorization':'Bearer '+token});const r=await fetch(path,opts);let d=null;try{d=await r.json()}catch(e){}if(r.status===401){localStorage.removeItem('asta_spectator_token');location.href='/'}return{r,d}}
function playerHero(p){const hero=el('div','player-hero');if(p?.img){const im=document.createElement('img');im.src=p.img;im.alt='';im.onerror=()=>im.replaceWith(el('div','hero-fallback',initials(p.name)));hero.appendChild(im)}else hero.appendChild(el('div','hero-fallback',initials(p?.name)));hero.append(el('div','player-name',p?.name||'—'),el('div','player-role',(p?.roles||[]).map(roleLabel).join(' · ')),el('div','player-club',p?.club||''));return hero}
function timerBlock(){const d=el('div','timer');const strong=el('strong','',String(state.seconds_left??0));strong.id='timerVal';const label=el('div','tiny muted',state.paused?'IN PAUSA':'secondi');const line=el('div','timer-line');const fill=el('div','timer-fill');fill.id='timerFill';line.appendChild(fill);d.append(strong,label,line);startTimer(state.seconds_left??0,state.duration||60);return d}function startTimer(v,total){clearInterval(timerInt);let n=Math.max(0,Number(v)||0);const update=()=>{const x=$('timerVal'),f=$('timerFill');if(x){x.textContent=String(Math.ceil(n));x.classList.toggle('urgent',n<=10)}if(f){f.style.width=`${Math.max(0,Math.min(100,n/total*100))}%`;f.classList.toggle('urgent',n<=10)}if(!state?.paused)n=Math.max(0,n-1)};update();timerInt=setInterval(update,1000)}
function appendReleased(container,released){if(!released?.length)return;const wrap=el('div','release-summary');wrap.appendChild(el('div','eyebrow history-section-title','Svincolati'));released.forEach(g=>{const row=el('div','release-line');row.append(el('span','',g.name||`ID ${g.pid}`),el('span','price',`${g.price} cr`));wrap.appendChild(row)});container.appendChild(wrap)}function appendOffers(container,reveal,collapsible=false){if(!reveal)return;const content=collapsible?document.createElement('details'):el('div','history-offers');content.className='history-offers';if(collapsible){const sum=document.createElement('summary');sum.textContent='Offerte';content.appendChild(sum)}else content.appendChild(el('div','eyebrow history-section-title','Offerte'));Object.entries(reveal).sort((a,b)=>b[1]-a[1]).forEach(([team,v])=>{const row=el('div','offer-row');row.append(el('span','',team),el('span','price',v===0?'PASSO':String(v)));content.appendChild(row)});container.appendChild(content)}
function resultCard(r){const c=el('section','card result');if(r.type==='no_offers'){c.append(el('div','eyebrow','Esito'),el('h2','',`${r.player_name} è passato`),el('p','small muted','Nessuna offerta.'))}else{c.append(el('div','eyebrow','Ultimo risultato'),el('h2','',`🏆 ${r.player_name} → ${r.team}`),el('div','center price',`${r.price} crediti`));if(r.tocca)c.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · spareggio chiuso in parità'));appendReleased(c,r.released)}if(r.reveal)appendOffers(c,r.reveal,true);return c}
function renderAuction(){clearInterval(timerInt);const box=$('view-auction');clear(box);if(!state)return;if(state.simulation)box.appendChild(el('div','notice warn','🧪 MODALITÀ SIMULAZIONE'));if(state.mode==='idle'){if(state.last_result)box.appendChild(resultCard(state.last_result));const c=el('section','card accent');c.append(el('div','eyebrow','Asta Rannatoni'),el('h2','','In attesa della prossima estrazione'));const active=(state.teams||[]).filter(t=>!t.market_finished);c.appendChild(el('div','notice',`${active.filter(t=>t.ready).length}/${active.length} Rannatoni pronti`));box.appendChild(c);return}if(state.mode==='bidding'||state.mode==='tiebreak'){const c=el('section','card accent');c.appendChild(playerHero(state.current_player));c.appendChild(timerBlock());if(state.mode==='tiebreak')c.appendChild(el('div','notice warn',`⚔️ Spareggio a ${state.tiebreak_value} crediti: ${(state.eligible_teams||[]).join(', ')}`));box.appendChild(c);const status=el('section','card');status.append(el('div','eyebrow','Buste'),el('h2','',`${state.submitted.length}/${state.eligible_teams.length} risposte`),el('p','small muted','Le cifre restano segrete fino all’apertura delle buste.'));box.appendChild(status);return}if(state.mode==='release'){const c=el('section','card');if(state.current_player)c.appendChild(playerHero(state.current_player));c.append(el('h2','',`💰 ${state.release_public?.team||'Il vincitore'} sta effettuando gli svincoli`),el('p','muted small','Il risultato definitivo comparirà appena l’acquisto sarà completato.'));box.appendChild(c)}}
async function loadAllRosters(preserve=true){const box=$('view-rosters'),y=preserve?window.scrollY:0;if(!preserve){clear(box);box.appendChild(el('div','notice','Caricamento rose…'))}const{r,d}=await api('/api/spectator/rosters');if(!r.ok)return;clear(box);lastAllRostersKey=(d.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|');if(selectedRosterTeam){const team=(d.teams||[]).find(t=>t.name===selectedRosterTeam);if(!team){selectedRosterTeam=null;return loadAllRosters(false)}const back=el('button','btn-ghost btn-sm','← Tutte le rose');back.onclick=()=>{selectedRosterTeam=null;loadAllRosters(false)};const head=el('section','card compact');head.append(back,el('div','eyebrow','Rosa Rannatoni'),el('h2','',team.name),el('div','roster-summary',`${team.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-team.roster_size)} posti liberi · ${team.budget} cr`));box.appendChild(head);const list=el('section','card player-list');sortRoster((d.rosters||{})[team.name]||[]).forEach(g=>list.appendChild(playerRow(g)));box.appendChild(list)}else{const head=el('section','card compact');head.append(el('div','eyebrow','Rannatoni'),el('h2','','Tutte le rose'),el('p','small muted','Tocca una squadra per vedere i giocatori.'));box.appendChild(head);const list=el('section','card');(d.teams||[]).forEach(t=>{const row=el('button','roster-team-row');const left=el('div','grow');left.append(el('div','team-name',t.name+(t.market_finished?' 🏁':'')),el('div','team-meta',`${t.roster_size}/${d.max_roster} giocatori · ${Math.max(0,d.max_roster-t.roster_size)} posti liberi`));row.append(left,el('span','roster-budget',`${t.budget} cr`));row.onclick=()=>{selectedRosterTeam=t.name;loadAllRosters(false)};list.appendChild(row)});box.appendChild(list)}if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}
async function loadHistory(){const box=$('view-history');clear(box);box.appendChild(el('div','notice','Caricamento storico…'));const{r,d}=await api('/api/spectator/history');clear(box);if(!r.ok)return;const h=el('section','card compact');h.append(el('div','eyebrow','Rannatoni'),el('h2','','Storico asta'));box.appendChild(h);if(!d.length){h.appendChild(el('p','muted small','Nessuna asta conclusa.'));return}(d||[]).forEach(ev=>{const det=document.createElement('details');const sum=document.createElement('summary');sum.textContent=ev.event_type==='no_offers'?`${ev.player_name} — PASSATO`:`${ev.player_name} — ${ev.team} — ${ev.price} cr`;det.appendChild(sum);det.appendChild(el('div','tiny muted',String(ev.ts||'').replace('T',' ')));if(ev.tocca)det.appendChild(el('div','notice random-win','🎲 VITTORIA CASUALE · assegnato tramite sorteggio.'));appendReleased(det,ev.released);if(ev.reveal)appendOffers(det,ev.reveal);box.appendChild(det)})}
function setView(name){currentView=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));['auction','rosters','history'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));if(name==='auction')renderAuction();if(name==='rosters')loadAllRosters(false);if(name==='history')loadHistory()}document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('exitBtn').onclick=()=>{const body=el('div');body.appendChild(el('div','notice','👀 Modalità spettatore'));const b=el('button','btn-danger btn-block','Disconnetti');b.onclick=logout;body.appendChild(b);const card=$('modalCard');clear(card);card.append(el('div','modal-title','Spettatore'),body);$('modal').classList.remove('hidden')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};async function logout(){try{await api('/api/logout',{method:'POST'})}catch(e){}localStorage.removeItem('asta_spectator_token');location.href='/'}
function allRostersKey(s){return(s?.teams||[]).map(t=>`${t.name}:${t.roster_size}:${t.budget}:${t.market_finished?1:0}`).join('|')}function handleState(s){const old=allRostersKey(state);state=s;if(currentView==='auction')renderAuction();else if(currentView==='rosters'&&allRostersKey(s)!==old&&allRostersKey(s)!==lastAllRostersKey)loadAllRosters(true)}function sendPing(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',visibility:document.visibilityState}))}function connect(){clearTimeout(reconnectTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onopen=()=>{setConn('online','Connesso');sendPing()};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handleState(m.data);if(m.type==='result'){if(currentView==='history')loadHistory();if(currentView==='rosters')loadAllRosters(true)}}catch(err){}};ws.onclose=()=>{setConn('background','Riconnessione…');reconnectTimer=setTimeout(connect,1800)};ws.onerror=()=>setConn('offline','Problema di rete')}document.addEventListener('visibilitychange',sendPing);setInterval(sendPing,8000);connect();api('/api/spectator/state').then(({r,d})=>{if(r.ok)handleState(d)});
</script></body></html>
